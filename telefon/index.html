<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexTalk - Modern VoIP Phone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PeerJS for WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Dark Mode Arka Planı */
        .dark body {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        }

        /* Light Mode Arka Planı */
        body {
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
        }

        /* Dark Mode Cam Paneli */
        .dark .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Light Mode Cam Paneli */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        /* Dark Mode Butonlar */
        .dark .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #f8fafc;
        }
        .dark .glass-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Light Mode Butonlar */
        .glass-btn {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.06);
            color: #0f172a;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .pulse-ring {
            position: relative;
        }

        .pulse-ring::before {
            content: '';
            position: absolute;
            left: -12px; top: -12px; right: -12px; bottom: -12px;
            border: 2px solid #10b981;
            border-radius: 50%;
            animation: pulse-out 1.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes pulse-out {
            0% { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.2); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Ana Uygulama Konteyneri -->
    <div class="glass-panel w-full max-w-md rounded-3xl overflow-hidden shadow-2xl flex flex-col h-[750px] relative">
        
        <!-- Üst Bar / Durum Bilgisi & Tema Değiştirici -->
        <header class="p-5 border-b border-black/5 dark:border-white/5 flex justify-between items-center bg-white/40 dark:bg-slate-900/40">
            <div class="flex items-center gap-3">

                        <!-- Tema Değiştirme Butonu -->

                    <div class="flex items-center gap-2">

            <!-- Kullanıcının Kendi Peer ID'si -->
            <div class="bg-indigo-500/10 dark:bg-indigo-950/50 border border-indigo-500/20 px-3 py-1.5 rounded-xl text-right">

        <!-- İçerik Alanı -->
        <main class="flex-1 overflow-y-auto relative p-5">

                    <button onclick="appendNum('8')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center"><span class="text-xl font-semibold">8</span><span class="text-[9px] text-slate-400">TUV</span></button>

                        <i data-lucide="phone" class="w-7 h-7 fill-current"></i>

            </div>

        <!-- Alt Gezinti Barı -->
        <nav class="border-t border-black/5 dark:border-white/5 bg-white/60 dark:bg-slate-900/60 p-3 grid grid-cols-3 gap-2">
            <button onclick="switchTab('dialer')" id="nav-dialer" class="flex flex-col items-center py-2 rounded-xl text-indigo-600 dark:text-indigo-400 bg-indigo-500/10">
                <i data-lucide="grid" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-semibold">Tuşlar</span>
            </button>
            <button onclick="switchTab('contacts')" id="nav-contacts" class="flex flex-col items-center py-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
                <i data-lucide="users" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-semibold">Rehber</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center py-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
                <i data-lucide="clock" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-semibold">Geçmiş</span>
            </button>
        </nav>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        lucide.createIcons();

        // -----------------------------------------------------------------
        // Tema Yönetimi (Dark / Light Mode)
        // -----------------------------------------------------------------
        function initTheme() {
            const savedTheme = localStorage.getItem('nextalk_theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('nextalk_theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const iconBtn = document.getElementById('theme-icon');
            iconBtn.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        // -----------------------------------------------------------------
        // Audio Effects (DTMF, Gelen Zil Sesi, Giden Arama/Çevir Sesi)
        // -----------------------------------------------------------------
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let ringtoneInterval = null;
        let ringbackInterval = null;

        function playDTMF(freq1, freq2) {
            if (AudioCtx.state === 'suspended') AudioCtx.resume();
            const osc1 = AudioCtx.createOscillator();
            const osc2 = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();

            osc1.frequency.value = freq1;
            osc2.frequency.value = freq2;
            gain.gain.value = 0.05;

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(AudioCtx.destination);

            osc1.start(); osc2.start();
            setTimeout(() => { osc1.stop(); osc2.stop(); }, 120);
        }

        const dtmfFreqs = {
            '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
            '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
            '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
            '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
        };

        // Gelen Arama Zil Sesi
        function startRingtone() {
            stopAudioSounds();
            const playToneCycle = () => {
                if (AudioCtx.state === 'suspended') AudioCtx.resume();
                const now = AudioCtx.currentTime;
                const osc1 = AudioCtx.createOscillator();
                const osc2 = AudioCtx.createOscillator();
                const gain = AudioCtx.createGain();

                osc1.frequency.value = 440;
                osc2.frequency.value = 480;
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                osc1.connect(gain); osc2.connect(gain);
                gain.connect(AudioCtx.destination);

                osc1.start(now); osc2.start(now);
                osc1.stop(now + 1.2); osc2.stop(now + 1.2);
            };
            playToneCycle();
            ringtoneInterval = setInterval(playToneCycle, 3000);
        }

        // Giden Arama Sesi (Ringback Tone / "Dıııt... Dıııt...")
        function startRingbackTone() {
            stopAudioSounds();
            const playRingbackCycle = () => {
                if (AudioCtx.state === 'suspended') AudioCtx.resume();
                const now = AudioCtx.currentTime;
                const osc1 = AudioCtx.createOscillator();
                const osc2 = AudioCtx.createOscillator();
                const gain = AudioCtx.createGain();

                // Standart Avrupa Çevir Tonal Sesi (425Hz)
                osc1.frequency.value = 425;
                osc2.frequency.value = 450;
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

                osc1.connect(gain); osc2.connect(gain);
                gain.connect(AudioCtx.destination);

                osc1.start(now); osc2.start(now);
                osc1.stop(now + 1.5); osc2.stop(now + 1.5);
            };
            playRingbackCycle();
            ringbackInterval = setInterval(playRingbackCycle, 4000); // Her 4 saniyede bir dıııt sesi
        }

        function stopAudioSounds() {
            if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
            if (ringbackInterval) { clearInterval(ringbackInterval); ringbackInterval = null; }
        }

        // -----------------------------------------------------------------
        // PeerJS & Arama Mantığı
        // -----------------------------------------------------------------
        let peer = null;
        let currentCall = null;
        let localStream = null;
        let myPeerID = '';
        let timerInterval = null;
        let secondsElapsed = 0;
        let isMuted = false;

        let contacts = JSON.parse(localStorage.getItem('nextalk_contacts') || JSON.stringify([
            { name: "Ahmet Yılmaz", id: "1024" },
            { name: "Ayşe Kaya", id: "5542" }
        ]));

        let callHistory = JSON.parse(localStorage.getItem('nextalk_history') || '[]');

        function generateShortID() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function initPeer() {
            myPeerID = generateShortID();
            peer = new Peer('nextalk-' + myPeerID);

            peer.on('open', () => {
                document.getElementById('my-id').innerText = myPeerID;
                document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('status-text').innerText = "Çevrimiçi";
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    initPeer();
                } else {
                    document.getElementById('status-text').innerText = "Bağlantı Hatası";
                    document.getElementById('status-dot').className = "w-2 h-2 rounded-full bg-rose-500";
                }
            });

            peer.on('call', (incomingCall) => {
                currentCall = incomingCall;
                showIncomingCallOverlay(incomingCall.peer.replace('nextalk-', ''));
            });
        }

        async function getMediaStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                return localStream;
            } catch (err) {
                alert("Mikrofon erişim izni reddedildi.");
                return null;
            }
        }

        async function makeCall() {
            const targetID = document.getElementById('phone-display').value.trim();
            if (!targetID) { alert("Lütfen ID girin!"); return; }
            if (targetID === myPeerID) { alert("Kendini arayamazsın!"); return; }

            const stream = await getMediaStream();
            if (!stream) return;

            showCallOverlay(targetID, "Aranıyor...");
            document.getElementById('btn-accept').classList.add('hidden');
            
            // Giden arama sesini (Ringback) başlat
            startRingbackTone();

            currentCall = peer.call('nextalk-' + targetID, stream);

            currentCall.on('stream', (remoteStream) => {
                stopAudioSounds(); // Karşı taraf açtı, arama sesini durdur
                document.getElementById('remote-audio').srcObject = remoteStream;
                startCallTimer();
                document.getElementById('call-status-label').innerText = "Bağlandı";
            });

            currentCall.on('close', () => resetCallUI());
            addHistory(targetID, 'outgoing');
        }

        function showIncomingCallOverlay(remoteID) {
            startRingtone(); // Gelen arama zil sesini başlat
            const contact = contacts.find(c => c.id === remoteID);
            const displayName = contact ? `${contact.name} (${remoteID})` : `ID: ${remoteID}`;

            showCallOverlay(remoteID, "Gelen Arama...");
            document.getElementById('call-remote-id').innerText = displayName;
            document.getElementById('btn-accept').classList.remove('hidden');
            document.getElementById('call-avatar-wrap').classList.add('pulse-ring');
        }

        async function acceptCall() {
            stopAudioSounds();
            const stream = await getMediaStream();
            if (!stream) return;

            document.getElementById('btn-accept').classList.add('hidden');
            document.getElementById('call-avatar-wrap').classList.remove('pulse-ring');
            document.getElementById('call-status-label').innerText = "Bağlandı";

            currentCall.answer(stream);

            currentCall.on('stream', (remoteStream) => {
                document.getElementById('remote-audio').srcObject = remoteStream;
                startCallTimer();
            });

            currentCall.on('close', () => resetCallUI());
            addHistory(currentCall.peer.replace('nextalk-', ''), 'incoming');
        }

        function endCall() {
            stopAudioSounds();
            if (currentCall) currentCall.close();
            resetCallUI();
        }

        function showCallOverlay(id, statusText) {
            const contact = contacts.find(c => c.id === id);
            const titleText = contact ? `${contact.name} (${id})` : `ID: ${id}`;
            document.getElementById('call-remote-id').innerText = titleText;
            document.getElementById('call-status-label').innerText = statusText;
            document.getElementById('call-overlay').classList.remove('translate-y-full');
        }

        function resetCallUI() {
            stopAudioSounds();
            document.getElementById('call-overlay').classList.add('translate-y-full');
            document.getElementById('call-avatar-wrap').classList.remove('pulse-ring');
            stopCallTimer();
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            currentCall = null;
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            const btn = document.getElementById('btn-mute');
            if (isMuted) {
                btn.classList.add('bg-rose-500/20', 'text-rose-400', 'border-rose-500/30');
            } else {
                btn.classList.remove('bg-rose-500/20', 'text-rose-400', 'border-rose-500/30');
            }
        }

        function startCallTimer() {
            stopCallTimer();
            secondsElapsed = 0;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('call-timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopCallTimer() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('call-timer').innerText = "00:00";
        }

        // Tuş Takımı & Arayüz Mantığı
        function appendNum(num) {
            const display = document.getElementById('phone-display');
            if (display.value.length < 6) {
                display.value += num;
                if (dtmfFreqs[num]) playDTMF(dtmfFreqs[num][0], dtmfFreqs[num][1]);
            }
        }

        function deleteNum() {
            const display = document.getElementById('phone-display');
            display.value = display.value.slice(0, -1);
        }

        function copyMyID() {
            navigator.clipboard.writeText(myPeerID);
            alert("Oda ID'niz kopyalandı: " + myPeerID);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            ['dialer', 'contacts', 'history'].forEach(nav => {
                const btn = document.getElementById('nav-' + nav);
                if (nav === tabName) {
                    btn.className = "flex flex-col items-center py-2 rounded-xl text-indigo-600 dark:text-indigo-400 bg-indigo-500/10";
                } else {
                    btn.className = "flex flex-col items-center py-2 rounded-xl text-slate-400 hover:text-slate-700 dark:hover:text-slate-200";
                }
            });
        }

        // Rehber İşlemleri
        function toggleContactModal(show) {
            const modal = document.getElementById('add-contact-modal');
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.getElementById('new-contact-name').value = '';
                document.getElementById('new-contact-id').value = '';
            }
        }

        function saveNewContact() {
            const name = document.getElementById('new-contact-name').value.trim();
            const id = document.getElementById('new-contact-id').value.trim();
            if (!name || !id) { alert("Lütfen alanları doldurun!"); return; }

            contacts.push({ name, id });
            localStorage.setItem('nextalk_contacts', JSON.stringify(contacts));
            renderContacts();
            toggleContactModal(false);
        }

        function renderContacts() {
            const container = document.getElementById('contacts-list');
            if (contacts.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Rehber boş.</p>`;
                return;
            }
            container.innerHTML = contacts.map(c => `
                <div class="glass-btn p-3 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-black/5 dark:border-white/5 flex items-center justify-center font-bold text-indigo-600 dark:text-indigo-400">
                            ${c.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h4 class="text-sm font-semibold text-slate-800 dark:text-white">${c.name}</h4>
                            <p class="text-xs text-slate-400 font-mono">ID: ${c.id}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="quickCall('${c.id}')" class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500 hover:text-white flex items-center justify-center transition-colors">
                            <i data-lucide="phone" class="w-4 h-4"></i>
                        </button>
                        <button onclick="deleteContact('${c.id}')" class="w-9 h-9 rounded-xl text-slate-400 hover:text-rose-500 flex items-center justify-center transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function deleteContact(id) {
            contacts = contacts.filter(c => c.id !== id);
            localStorage.setItem('nextalk_contacts', JSON.stringify(contacts));
            renderContacts();
        }

        function quickCall(id) {
            document.getElementById('phone-display').value = id;
            switchTab('dialer');
            makeCall();
        }

        function addHistory(id, type) {
            const contact = contacts.find(c => c.id === id);
            const displayName = contact ? contact.name : `ID: ${id}`;
            const item = {
                id,
                name: displayName,
                type,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            callHistory.unshift(item);
            localStorage.setItem('nextalk_history', JSON.stringify(callHistory));
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            if (callHistory.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Henüz arama kaydı yok.</p>`;
                return;
            }
            container.innerHTML = callHistory.map(h => `
                <div class="glass-btn p-3 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl ${h.type === 'outgoing' ? 'bg-indigo-500/10 text-indigo-500' : 'bg-emerald-500/10 text-emerald-500'} flex items-center justify-center">
                            <i data-lucide="${h.type === 'outgoing' ? 'phone-outgoing' : 'phone-incoming'}" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-semibold text-slate-800 dark:text-white">${h.name}</h4>
                            <p class="text-xs text-slate-400">${h.type === 'outgoing' ? 'Giden' : 'Gelen'} • ${h.time}</p>
                        </div>
                    </div>
                    <button onclick="quickCall('${h.id}')" class="text-slate-400 hover:text-slate-700 dark:hover:text-white p-2">
                        <i data-lucide="phone" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function clearHistory() {
            callHistory = [];
            localStorage.removeItem('nextalk_history');
            renderHistory();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initPeer();
            renderContacts();
            renderHistory();
        });
    </script>
</body>
</html>
