services:
  - type: web
    name: html-den-apk
    runtime: node
    rootDir: HTML-den-APK
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/html-den-apk-data
      - key: GH_TOKEN
        sync: false
      - key: GH_OWNER
        sync: false
      - key: GH_REPO
        sync: false
      - key: GH_BRANCH
        value: main
      - key: GH_WORKFLOW
        value: build-android.yml
      - key: BUILD_WEBHOOK_SECRET
        sync: false
      - key: SOURCE_ACCESS_SECRET
        sync: false
