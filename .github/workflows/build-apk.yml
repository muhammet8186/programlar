
name: HTML to Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Android uygulama adi
        required: true
        type: string
        default: Yeni Uygulamam
      package_id:
        description: Paket kimligi (or. com.muhammet.uygulama)
        required: true
        type: string
        default: com.muhammet.yeniuygulamam

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK lisanslarini kabul et
        run: yes | sdkmanager --licenses

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: HTML dosyasini kontrol et
        run: |
          if [ ! -f "webapp/index.html" ]; then
            echo "HATA: webapp/index.html bulunamadi!"
            exit 1
          fi

      - name: Capacitor projesini olustur
        run: |
          mkdir -p build-src/www
          cp -r webapp/. build-src/www/

          cd build-src
          npm init -y

          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www"
          }
          EOF
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.package_id }}

      - name: Android projesini olustur
        run: |
          cd build-src
          npx cap add android
          npx cap sync android

      - name: APK derle
        run: |
          cd build-src/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
