
name: HTML to Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Android uygulama adı
        required: true
        type: string
        default: Yeni Uygulamam
      package_id:
        description: Benzersiz paket kimliği (ör. com.muhammet.uygulama)
        required: true
        type: string
        default: com.muhammet.yeniuygulamam

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
          with:
            accept-android-sdk-licenses: true

      - name: Android SDK lisanslarını otomatik kabul et
        run: yes | sdkmanager --licenses

      - name: Android SDK paketlerini kur
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: HTML dosyasını kontrol et
        run: |
          if [ ! -f "webapp/index.html" ]; then
            echo "HATA: webapp/index.html bulunamadı!"
            echo "HTML dosyan webapp klasöründe olmalıdır."
            exit 1
          fi

      - name: Capacitor projesini oluştur
        run: |
          mkdir -p build-src/www
          cp -r webapp/* build-src/www/

          cd build-src
          npm init -y

          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

          node -e "
          const fs = require('fs');
          const appName = process.env.APP_NAME || 'Yeni Uygulamam';
          const appId = process.env.APP_ID || 'com.muhammet.yeniuygulamam';

          fs.writeFileSync(
            'capacitor.config.json',
            JSON.stringify({
              appId: appId,
              appName: appName,
              webDir: 'www',
              bundledWebRuntime: false
            }, null, 2)
          );
          "
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.package_id }}

      - name: Android projesini oluştur
        run: |
          cd build-src
          npx cap add android
          npx cap sync android

      - name: APK derle
        run: |
          cd build-src/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
