<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş M3U IPTV Kontrol ve Oynatıcı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- HLS.js for streaming m3u8 in browsers -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-cardBg border-b border-slate-800 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2 text-indigo-400">
                <i class="fa-solid fa-tv"></i> M3U Kanal Kontrol & Oynatıcı
            </h1>
            <span class="text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full">
                Otomatik Tarama Destekli
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-4 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Sol Panel: Yükleme, Kontrol ve Liste -->
        <div class="lg:col-span-1 flex flex-col gap-4">
            
            <!-- Dosya / Metin Yükleme Kutusu -->
            <div class="bg-cardBg p-4 rounded-xl border border-slate-800 shadow-sm">
                <h2 class="text-sm font-semibold mb-2 text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-file-arrow-up text-indigo-400"></i> M3U Listesi Yükle
                </h2>
                
                <div class="flex flex-col gap-3">
                    <input type="file" id="m3uFile" accept=".m3u,.m3u8,.txt" class="text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
                    
                    <textarea id="m3uText" rows="3" placeholder="Veya M3U içeriğini buraya yapıştırın..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button id="loadBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-3 rounded-lg text-xs transition-colors flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-rotate"></i> Yükle
                        </button>
                        <button id="checkAllBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-3 rounded-lg text-xs transition-colors flex items-center justify-center gap-1.5 disabled:opacity-50" disabled>
                            <i class="fa-solid fa-circle-check"></i> Tümünü Kontrol Et
                        </button>
                    </div>
                </div>

                <!-- İlerleme Çubuğu -->
                <div id="progressContainer" class="mt-3 hidden">
                    <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                        <span id="progressText">Taranıyor...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
                        <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
                    </div>
                </div>
            </div>

            <!-- Arama, Filtreler ve Kanal Listesi -->
            <div class="bg-cardBg p-4 rounded-xl border border-slate-800 shadow-sm flex flex-col h-[460px]">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-list text-indigo-400"></i> Kanallar (<span id="channelCount">0</span>)
                    </h2>
                    <button id="exportWorkingBtn" class="text-xs bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 border border-emerald-500/30 px-2.5 py-1.5 rounded-lg transition-colors flex items-center gap-1 disabled:opacity-40" disabled>
                        <i class="fa-solid fa-download"></i> Çalışanları İndir
                    </button>
                </div>

                <!-- Durum Filtre Butonları -->
                <div class="grid grid-cols-3 gap-1.5 mb-3 text-xs">
                    <button data-filter="all" class="filter-btn bg-indigo-600 text-white py-1.5 px-2 rounded-lg font-medium transition-colors">Tümü</button>
                    <button data-filter="working" class="filter-btn bg-slate-900 text-slate-400 hover:bg-slate-800 py-1.5 px-2 rounded-lg font-medium transition-colors">Çalışanlar</button>
                    <button data-filter="dead" class="filter-btn bg-slate-900 text-slate-400 hover:bg-slate-800 py-1.5 px-2 rounded-lg font-medium transition-colors">Çalışmayan</button>
                </div>

                <!-- Arama Kutusu -->
                <div class="relative mb-3">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-xs"></i>
                    <input type="text" id="searchBox" placeholder="Kanal ara..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <!-- Liste Alanı -->
                <div id="channelList" class="flex-grow overflow-y-auto space-y-1.5 pr-1 custom-scrollbar">
                    <div class="text-center text-slate-500 text-xs py-12">
                        Henüz liste yüklenmedi.<br>Lütfen dosya seçin veya yapıştırın.
                    </div>
                </div>
            </div>

        </div>

        <!-- Sağ Panel: Video Oynatıcı -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            <div class="bg-cardBg p-4 rounded-xl border border-slate-800 shadow-sm flex flex-col h-full">
                <h2 id="currentChannelTitle" class="text-base font-bold text-slate-200 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-circle-play text-indigo-400"></i> Oynatıcı (Kanal Seçilmedi)
                </h2>
                
                <!-- Video Konteyner -->
                <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
                    <video id="videoPlayer" controls autoplay class="w-full h-full object-contain"></video>
                    <div id="playerPlaceholder" class="absolute inset-flex flex-col items-center justify-center text-slate-500 text-sm gap-2">
                        <i class="fa-solid fa-tv text-4xl opacity-40"></i>
                        İzlemek için soldan bir kanal seçin
                    </div>
                </div>

                <!-- Bilgi Alanı -->
                <div class="mt-4 p-3 bg-slate-900/50 rounded-lg border border-slate-800/80 text-xs text-slate-400 flex flex-col gap-1">
                    <div><strong class="text-slate-300">Yayın Adresi:</strong> <span id="currentUrl" class="break-all font-mono text-slate-500">-</span></div>
                </div>
            </div>
        </div>

    </main>

    <!-- JavaScript Mantığı -->
    <script>
        let channels = [];
        let currentFilter = 'all';
        let hls = null;

        const m3uFileInput = document.getElementById('m3uFile');
        const m3uTextInput = document.getElementById('m3uText');
        const loadBtn = document.getElementById('loadBtn');
        const checkAllBtn = document.getElementById('checkAllBtn');
        const exportWorkingBtn = document.getElementById('exportWorkingBtn');
        const channelListEl = document.getElementById('channelList');
        const channelCountEl = document.getElementById('channelCount');
        const searchBox = document.getElementById('searchBox');
        const videoPlayer = document.getElementById('videoPlayer');
        const playerPlaceholder = document.getElementById('playerPlaceholder');
        const currentChannelTitle = document.getElementById('currentChannelTitle');
        const currentUrlEl = document.getElementById('currentUrl');
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressText = document.getElementById('progressText');

        // Dosya seçildiğinde okuma
        m3uFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                m3uTextInput.value = event.target.result;
                parseM3U(event.target.result);
            };
            reader.readAsText(file);
        });

        loadBtn.addEventListener('click', () => {
            const content = m3uTextInput.value.trim();
            if (!content) {
                alert('Lütfen geçerli bir M3U içeriği girin veya dosya seçin.');
                return;
            }
            parseM3U(content);
        });

        // M3U Ayrıştırıcı
        function parseM3U(data) {
            channels = [];
            const lines = data.split('\n');
            let currentChannel = {};

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = { status: 'untested' };
                    
                    let logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentChannel.logo = logoMatch ? logoMatch[1] : '';

                    let groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Genel';

                    let nameParts = line.split(',');
                    currentChannel.name = nameParts.length > 1 ? nameParts[nameParts.length - 1].trim() : 'İsimsiz Kanal';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        channels.push(currentChannel);
                        currentChannel = {};
                    }
                }
            }

            renderChannels();
            checkAllBtn.disabled = channels.length === 0;
            exportWorkingBtn.disabled = true;
        }

        // Listeyi Ekrana Çizme
        function renderChannels() {
            const query = searchBox.value.toLowerCase();
            const filtered = channels.filter(ch => {
                const matchesQuery = ch.name.toLowerCase().includes(query) || ch.group.toLowerCase().includes(query);
                if (currentFilter === 'working') return matchesQuery && ch.status === 'working';
                if (currentFilter === 'dead') return matchesQuery && ch.status === 'dead';
                return matchesQuery;
            });

            channelCountEl.textContent = filtered.length;
            channelListEl.innerHTML = '';

            if (filtered.length === 0) {
                channelListEl.innerHTML = '<div class="text-center text-slate-500 text-xs py-8">Kanal bulunamadı.</div>';
                return;
            }

            filtered.forEach((ch) => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-2.5 bg-slate-900/60 hover:bg-slate-800 rounded-lg border border-slate-800/60 cursor-pointer transition-colors group';
                
                let statusBadge = '';
                if (ch.status === 'working') {
                    statusBadge = '<span class="w-2 h-2 rounded-full bg-emerald-500" title="Çalışıyor"></span>';
                } else if (ch.status === 'dead') {
                    statusBadge = '<span class="w-2 h-2 rounded-full bg-rose-500" title="Çalışmıyor"></span>';
                } else {
                    statusBadge = '<span class="w-2 h-2 rounded-full bg-slate-600" title="Test Edilmedi"></span>';
                }

                item.innerHTML = `
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        ${statusBadge}
                        <div class="w-7 h-7 rounded bg-slate-800 flex items-center justify-center shrink-0 overflow-hidden border border-slate-700">
                            ${ch.logo ? `<img src="${ch.logo}" class="w-full h-full object-contain" onerror="this.remove()">` : '<i class="fa-solid fa-tv text-slate-500 text-[10px]"></i>'}
                        </div>
                        <div class="overflow-hidden">
                            <h3 class="text-xs font-medium text-slate-200 truncate group-hover:text-indigo-400 transition-colors">${ch.name}</h3>
                            <span class="text-[10px] text-slate-500 truncate block">${ch.group}</span>
                        </div>
                    </div>
                    <button class="text-slate-400 hover:text-indigo-400 p-1 text-xs shrink-0">
                        <i class="fa-solid fa-play"></i>
                    </button>
                `;

                item.addEventListener('click', () => playStream(ch));
                channelListEl.appendChild(item);
            });
        }

        // Filtre Butonları İşlevi
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white');
                    b.classList.add('bg-slate-900', 'text-slate-400');
                });
                e.target.classList.remove('bg-slate-900', 'text-slate-400');
                e.target.classList.add('bg-indigo-600', 'text-white');
                
                currentFilter = e.target.getAttribute('data-filter');
                renderChannels();
            });
        });

        searchBox.addEventListener('input', () => renderChannels());

        // Tüm Kanalları Asenkron Test Etme Fonksiyonu
        checkAllBtn.addEventListener('click', async () => {
            if (channels.length === 0) return;

            checkAllBtn.disabled = true;
            loadBtn.disabled = true;
            progressContainer.classList.remove('hidden');
            
            let checkedCount = 0;
            const total = channels.length;

            for (let i = 0; i < channels.length; i++) {
                const ch = channels[i];
                progressText.textContent = `Test ediliyor: ${ch.name}`;
                
                try {
                    // Tarayıcı CORS engeline takılmamak için timeout süreli fetch veya image/video kontrolü
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000); // 4 saniye zaman aşımı

                    const response = await fetch(ch.url, { 
                        method: 'GET', 
                        mode: 'no-cors', 
                        signal: controller.signal 
                    });
                    clearTimeout(timeoutId);
                    
                    // no-cors modunda yanıt tipi 'opaque' döner, bağlantı kuruldu demektir
                    ch.status = 'working';
                } catch (err) {
                    // Fetch engellendiyse veya zaman aşımına uğradıysa alternatif olarak HLS / Video test denemesi yapılabilir
                    // Basitlik ve hız için ağ hatası alanlar ölü olarak işaretlenir
                    ch.status = 'dead';
                }

                checkedCount++;
                let percent = Math.round((checkedCount / total) * 100);
                progressBar.style.width = percent + '%';
                progressPercent.textContent = percent + '%';

                renderChannels();
            }

            progressText.textContent = 'Test Tamamlandı!';
            checkAllBtn.disabled = false;
            loadBtn.disabled = false;
            
            // Çalışan varsa indirme butonunu aktif et
            const workingCount = channels.filter(c => c.status === 'working').length;
            if (workingCount > 0) {
                exportWorkingBtn.disabled = false;
            }
        });

        // Yayın Oynatma
        function playStream(ch) {
            currentChannelTitle.innerHTML = `<i class="fa-solid fa-circle-play text-indigo-400"></i> Oynatılıyor: ${ch.name}`;
            currentUrlEl.textContent = ch.url;
            playerPlaceholder.style.display = 'none';

            if (Hls.isSupported() && ch.url.includes('.m3u8')) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => videoPlayer.play());
            } else {
                videoPlayer.src = ch.url;
                videoPlayer.play().catch(err => {
                    console.error("Oynatma hatası:", err);
                });
            }
        }

        // Sadece Çalışan Kanalları Dışarı Aktarma (M3U İndir)
        exportWorkingBtn.addEventListener('click', () => {
            const workingChannels = channels.filter(ch => ch.status === 'working');
            if (workingChannels.length === 0) {
                alert('İndirilecek çalışan kanal bulunamadı.');
                return;
            }

            let m3uContent = '#EXTM3U\n';
            workingChannels.forEach(ch => {
                m3uContent += `#EXTINF:-1 tvg-logo="${ch.logo || ''}" group-title="${ch.group || 'Genel'},${ch.name}\n`;
                m3uContent += `${ch.url}\n`;
            });

            const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'calisan_kanallar.m3u';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
