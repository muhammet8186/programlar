    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: rgba(30, 41, 59, 0.7);
            --bg-surface-hover: rgba(51, 65, 85, 0.8);
            --bg-glass: rgba(15, 23, 42, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #8b5cf6;
            --accent-secondary: #c084fc;
            --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%);
            --accent-gradient-hover: linear-gradient(135deg, #6d28d9 0%, #a855f7 100%);
            --card-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5);
            --player-bg: rgba(15, 23, 42, 0.95);
            --danger-color: #ef4444;
            --success-color: #10b981;
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-base: #f1f5f9;
            --bg-surface: rgba(255, 255, 255, 0.85);
            --bg-surface-hover: rgba(255, 255, 255, 0.98);
            --bg-glass: rgba(241, 245, 249, 0.9);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --card-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.06);
            --player-bg: rgba(255, 255, 255, 0.95);
        }

        body[data-theme="dark"] { color-scheme: dark; }
        body[data-theme="light"] { color-scheme: light; }

        /* 20 asil ve birbirinden ayrışan vurgu paleti */
        body[data-palette="violet"] { --accent-primary:#8b5cf6; --accent-secondary:#c084fc; --accent-gradient:linear-gradient(135deg,#7c3aed 0%,#c084fc 100%); --accent-gradient-hover:linear-gradient(135deg,#7c3aed 0%,#8b5cf6 100%); }
        body[data-palette="sapphire"] { --accent-primary:#2563eb; --accent-secondary:#93c5fd; --accent-gradient:linear-gradient(135deg,#1d4ed8 0%,#60a5fa 100%); --accent-gradient-hover:linear-gradient(135deg,#1d4ed8 0%,#2563eb 100%); }
        body[data-palette="emerald"] { --accent-primary:#059669; --accent-secondary:#6ee7b7; --accent-gradient:linear-gradient(135deg,#047857 0%,#34d399 100%); --accent-gradient-hover:linear-gradient(135deg,#047857 0%,#059669 100%); }
        body[data-palette="ruby"] { --accent-primary:#be123c; --accent-secondary:#fda4af; --accent-gradient:linear-gradient(135deg,#9f1239 0%,#fb7185 100%); --accent-gradient-hover:linear-gradient(135deg,#9f1239 0%,#be123c 100%); }
        body[data-palette="amber"] { --accent-primary:#d97706; --accent-secondary:#fcd34d; --accent-gradient:linear-gradient(135deg,#b45309 0%,#fbbf24 100%); --accent-gradient-hover:linear-gradient(135deg,#b45309 0%,#d97706 100%); }
        body[data-palette="teal"] { --accent-primary:#0f766e; --accent-secondary:#5eead4; --accent-gradient:linear-gradient(135deg,#115e59 0%,#2dd4bf 100%); --accent-gradient-hover:linear-gradient(135deg,#115e59 0%,#0f766e 100%); }
        body[data-palette="royal-blue"] { --accent-primary:#1e40af; --accent-secondary:#93c5fd; --accent-gradient:linear-gradient(135deg,#1e3a8a 0%,#60a5fa 100%); --accent-gradient-hover:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%); }
        body[data-palette="burgundy"] { --accent-primary:#881337; --accent-secondary:#fda4af; --accent-gradient:linear-gradient(135deg,#701a3a 0%,#e11d48 100%); --accent-gradient-hover:linear-gradient(135deg,#701a3a 0%,#881337 100%); }
        body[data-palette="jade"] { --accent-primary:#15803d; --accent-secondary:#86efac; --accent-gradient:linear-gradient(135deg,#166534 0%,#4ade80 100%); --accent-gradient-hover:linear-gradient(135deg,#166534 0%,#15803d 100%); }
        body[data-palette="copper"] { --accent-primary:#c2410c; --accent-secondary:#fdba74; --accent-gradient:linear-gradient(135deg,#9a3412 0%,#fb923c 100%); --accent-gradient-hover:linear-gradient(135deg,#9a3412 0%,#c2410c 100%); }
        body[data-palette="midnight"] { --accent-primary:#334155; --accent-secondary:#cbd5e1; --accent-gradient:linear-gradient(135deg,#1e293b 0%,#94a3b8 100%); --accent-gradient-hover:linear-gradient(135deg,#1e293b 0%,#334155 100%); }
        body[data-palette="gold"] { --accent-primary:#a16207; --accent-secondary:#fde68a; --accent-gradient:linear-gradient(135deg,#854d0e 0%,#facc15 100%); --accent-gradient-hover:linear-gradient(135deg,#854d0e 0%,#a16207 100%); }
        body[data-palette="ocean"] { --accent-primary:#0369a1; --accent-secondary:#7dd3fc; --accent-gradient:linear-gradient(135deg,#075985 0%,#38bdf8 100%); --accent-gradient-hover:linear-gradient(135deg,#075985 0%,#0369a1 100%); }
        body[data-palette="forest"] { --accent-primary:#166534; --accent-secondary:#bbf7d0; --accent-gradient:linear-gradient(135deg,#14532d 0%,#4ade80 100%); --accent-gradient-hover:linear-gradient(135deg,#14532d 0%,#166534 100%); }
        body[data-palette="plum"] { --accent-primary:#7e22ce; --accent-secondary:#d8b4fe; --accent-gradient:linear-gradient(135deg,#6b21a8 0%,#c084fc 100%); --accent-gradient-hover:linear-gradient(135deg,#6b21a8 0%,#7e22ce 100%); }
        body[data-palette="coral"] { --accent-primary:#e11d48; --accent-secondary:#fecdd3; --accent-gradient:linear-gradient(135deg,#be123c 0%,#fb7185 100%); --accent-gradient-hover:linear-gradient(135deg,#be123c 0%,#e11d48 100%); }
        body[data-palette="bronze"] { --accent-primary:#92400e; --accent-secondary:#fcd34d; --accent-gradient:linear-gradient(135deg,#78350f 0%,#f59e0b 100%); --accent-gradient-hover:linear-gradient(135deg,#78350f 0%,#92400e 100%); }
        body[data-palette="cyan"] { --accent-primary:#0e7490; --accent-secondary:#a5f3fc; --accent-gradient:linear-gradient(135deg,#155e75 0%,#67e8f9 100%); --accent-gradient-hover:linear-gradient(135deg,#155e75 0%,#0e7490 100%); }
        body[data-palette="olive"] { --accent-primary:#4d7c0f; --accent-secondary:#d9f99d; --accent-gradient:linear-gradient(135deg,#3f6212 0%,#a3e635 100%); --accent-gradient-hover:linear-gradient(135deg,#3f6212 0%,#4d7c0f 100%); }
        body[data-palette="charcoal"] { --accent-primary:#475569; --accent-secondary:#e2e8f0; --accent-gradient:linear-gradient(135deg,#334155 0%,#cbd5e1 100%); --accent-gradient-hover:linear-gradient(135deg,#334155 0%,#475569 100%); }
        .now-playing-art { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; background: var(--bg-surface-hover); border: 1px solid var(--border-color); flex: 0 0 54px; }
        .player-bar { transition: var(--transition); }
        .fullscreen-player { position: fixed; inset: 0; z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 28px; text-align: center; background: var(--bg-base); background-image: radial-gradient(circle at 50% 15%, rgba(139,92,246,.24), transparent 48%); opacity: 0; pointer-events: none; transition: var(--transition); }
        .fullscreen-player.show { opacity: 1; pointer-events: auto; }
        .fullscreen-visualizer { width:min(88vw, 1040px); height: min(48vh, 360px); display:block; border-radius:28px; background: radial-gradient(ellipse at center, rgba(139,92,246,.16), rgba(15,23,42,.08) 68%, transparent 100%); filter: drop-shadow(0 12px 34px rgba(139,92,246,.22)); }
        .fullscreen-heading { order:0; width:100%; padding:8px 56px 0; }
        .fullscreen-player h2 { font-size: clamp(22px, 4vw, 34px); }
        .fullscreen-player p { color: var(--text-secondary); }
        .fullscreen-visualizer { order:1; }
        .fullscreen-heading { flex:0 0 auto; }
        .fullscreen-actions { display:flex; gap:16px; align-items:center; padding:12px 18px; border:1px solid var(--border-color); border-radius:24px; background:var(--bg-surface); box-shadow:0 12px 34px rgba(0,0,0,.22); backdrop-filter:blur(14px); }
        .fullscreen-actions .btn-icon-only { width:68px; height:68px; border-radius:18px; border:1px solid var(--border-color); background:var(--bg-surface-hover); font-size:24px; }
        .fullscreen-actions .play-btn { width:86px; height:86px; min-width:86px; border-radius:22px; border:1px solid rgba(255,255,255,.18); font-size:30px; box-shadow:0 10px 28px rgba(139,92,246,.32); }
        .fullscreen-utility-actions { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap; }
        .fullscreen-utility-actions .btn { width:60px; height:60px; border-radius:18px; font-size:21px; }
        .fullscreen-volume-value { min-width:44px; color:var(--text-secondary); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
        @media (max-width:640px) { .fullscreen-player { gap:16px; padding:18px 12px; } .fullscreen-actions { gap:10px; padding:9px 12px; border-radius:20px; } .fullscreen-actions .btn-icon-only { width:62px; height:62px; border-radius:17px; font-size:22px; } .fullscreen-actions .play-btn { width:78px; height:78px; min-width:78px; border-radius:20px; font-size:28px; } .fullscreen-utility-actions { gap:10px; } .fullscreen-utility-actions .btn { width:56px; height:56px; } .fullscreen-utility-actions #fullscreen-shuffle { width:66px; height:66px; } }

        .recordings-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
        .recording-card { display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--border-color); border-radius:16px; background:var(--bg-surface); box-shadow:var(--card-shadow); min-width:0; }
        .recording-art { width:48px; height:48px; flex:0 0 48px; display:grid; place-items:center; border-radius:13px; color:white; background:var(--accent-gradient); font-size:19px; }
        .recording-meta { min-width:0; flex:1; text-align:left; }
        .recording-meta strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
        .recording-meta small { display:block; margin-top:4px; color:var(--text-secondary); font-size:11px; }
        .recording-actions { display:flex; gap:7px; flex:0 0 auto; }
        .recording-actions .btn { width:38px; min-width:38px; height:38px; padding:0; justify-content:center; border-radius:11px; }
        .recording-delete-modal { position:fixed; inset:0; z-index:6000; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(2,6,23,.72); backdrop-filter:blur(10px); opacity:0; pointer-events:none; transition:var(--transition); }
        .recording-delete-modal.show { opacity:1; pointer-events:auto; }
        .recording-delete-card { width:min(380px,100%); padding:24px; border:1px solid var(--border-color); border-radius:22px; background:var(--bg-base); box-shadow:0 24px 80px rgba(0,0,0,.45); text-align:center; }
        .recording-delete-card p { margin:10px 0 18px; color:var(--text-secondary); font-size:13px; }
        .recording-delete-actions { display:flex; gap:10px; }
        .recording-delete-actions .btn { flex:1; justify-content:center; }
        .btn-danger { background:#dc2626; color:#fff; border-color:#dc2626; }
        @media(max-width:640px){ .recordings-list{grid-template-columns:1fr;} .recording-card{padding:11px;} }

        .stations-grid.recordings-view { display:block; width:100%; }
        .stations-grid.recordings-view .recordings-list { width:100%; }
        .visualizer-wrapper {
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent-primary) 17%, transparent), color-mix(in srgb, var(--accent-primary) 5%, transparent));
            border-top-color: color-mix(in srgb, var(--accent-primary) 42%, transparent);
            box-shadow: 0 0 30px color-mix(in srgb, var(--accent-primary) 18%, transparent);
        }
