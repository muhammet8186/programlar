<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony Radio | Dünya Radyoları & Canlı Oynatıcı</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: rgba(30, 41, 59, 0.7);
            --bg-surface-hover: rgba(51, 65, 85, 0.8);
            --bg-glass: rgba(15, 23, 42, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #6366f1;
            --accent-secondary: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            --accent-gradient-hover: linear-gradient(135deg, #4f46e5 0%, #0891b2 100%);
            --card-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5);
            --player-bg: rgba(15, 23, 42, 0.95);
            --danger-color: #ef4444;
            --success-color: #10b981;
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-base: #f1f5f9;
            --bg-surface: rgba(255, 255, 255, 0.85);
            --bg-surface-hover: rgba(255, 255, 255, 0.98);
            --bg-glass: rgba(241, 245, 249, 0.9);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --card-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.06);
            --player-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
            padding-bottom: 150px;
        }

        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
        }
        .glow-2 {
            position: absolute;
            bottom: 10%;
            right: -10%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
        }

        .app-container {
            max-width: 1350px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .brand-title h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-title p {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(12px);
            transition: var(--transition);
        }

        .btn:hover {
            background: var(--bg-surface-hover);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-gradient-hover);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-icon-only {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            justify-content: center;
        }

        .search-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--card-shadow);
        }

        .search-row {
            display: grid;
            grid-template-columns: 2fr 1.2fr 0.8fr auto;
            gap: 10px;
            align-items: center;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-field, .select-field {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-base);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
        }

        .select-field {
            padding-left: 12px;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%2394a3b8" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 10px center;
            cursor: pointer;
        }

        .input-field:focus, .select-field:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .tabs-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tabs {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--bg-surface);
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: white;
        }

        /* Compact Stations Grid */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .station-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: var(--transition);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            cursor: pointer;
            min-height: 110px;
        }

        .station-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.4);
            background: var(--bg-surface-hover);
        }

        .station-card.playing {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .station-logo-wrap {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: var(--bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            position: relative;
        }

        .station-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .station-logo-fallback {
            font-size: 16px;
            color: var(--accent-primary);
        }

        .status-dot {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: 2px solid var(--bg-surface);
        }
        .status-dot.online { background: var(--success-color); box-shadow: 0 0 5px var(--success-color); }
        .status-dot.offline { background: var(--danger-color); box-shadow: 0 0 5px var(--danger-color); }

        .card-info {
            flex-grow: 1;
            min-width: 0;
        }

        .station-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .station-country {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px;
            z-index: 2;
        }

        .fav-btn:hover, .fav-btn.active {
            color: var(--danger-color);
            transform: scale(1.15);
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
            height: 20px;
            overflow: hidden;
        }

        .tag-badge {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-primary);
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 8px;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 10px;
            color: var(--text-muted);
            padding-top: 6px;
            border-top: 1px solid var(--border-color);
        }

        /* Web Audio API Visualizer */
        .visualizer-wrapper {
            position: fixed;
            bottom: 74px;
            left: 0;
            width: 100vw;
            height: 40px;
            z-index: 99;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0) 0%, var(--bg-base) 100%);
        }

        #visualizer-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Compact Floating Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--player-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            padding: 10px 20px;
            z-index: 100;
            display: grid;
            grid-template-columns: 1.2fr 1.2fr 1.2fr;
            align-items: center;
            gap: 16px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.4);
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .now-playing-img {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: var(--bg-base);
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .now-playing-meta {
            min-width: 0;
        }

        .now-playing-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing-sub {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .control-btns {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            color: white;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: var(--transition);
        }

        .play-btn:hover { transform: scale(1.08); }

        .record-btn.recording {
            color: var(--danger-color);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .extra-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100px;
        }

        .volume-box i {
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            width: 16px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 4px;
            background: var(--border-color);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .eq-select {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
        }

        /* Modern Modal Popup */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-title { 
            font-size: 16px; 
            font-weight: 700; 
            margin-bottom: 14px; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            color: var(--text-primary);
        }
        .modal-input {
            width: 100%; padding: 10px 12px; margin-bottom: 10px;
            border-radius: var(--radius-md); border: 1px solid var(--border-color);
            background: var(--bg-base); color: var(--text-primary); font-size: 13px; outline: none;
            transition: var(--transition);
        }
        .modal-input:focus { border-color: var(--accent-primary); }
        .modal-section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); }
        .modal-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .modal-section-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(16px);
            padding: 12px 18px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 3000;
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show { transform: translateX(0); }
        .toast.error i { color: var(--danger-color); }
        .toast.success i { color: var(--success-color); }

        .loading-state, .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            font-size: 28px;
            color: var(--accent-primary);
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 992px) {
            .search-row { grid-template-columns: 1fr 1fr; }
            .player-bar { grid-template-columns: 1fr auto; padding: 10px 16px; }
            .extra-controls { display: none; }
        }

        @media (max-width: 640px) {
            .search-row { grid-template-columns: 1fr; }
            .now-playing-sub { display: none; }
            .app-container { padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i id="toast-icon" class="fa-solid fa-circle-info"></i>
        <span id="toast-msg">Bildirim mesajı</span>
    </div>

    <!-- Modern Settings Modal -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title"><i class="fa-solid fa-gear" style="color:var(--accent-primary);"></i> Ayarlar & Yönetim</div>
            
            <div class="modal-section">
                <div class="modal-section-title">Özel Radyo Ekle</div>
                <input type="text" id="custom-name" class="modal-input" placeholder="Radyo Adı">
                <input type="text" id="custom-url" class="modal-input" placeholder="Yayın Akış URL (.mp3, .aac, .pls)">
                <input type="text" id="custom-country" class="modal-input" placeholder="Ülke / Şehir (Opsiyonel)">
                <button class="btn btn-primary" id="custom-save" style="width:100%; justify-content:center;"><i class="fa-solid fa-plus"></i> Radyoyu Kaydet</button>
            </div>

            <div class="modal-section" style="margin-top: 12px;">
                <div class="modal-section-title">Veri Yedekleme & Geri Yükleme</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn" id="export-json-modal" style="flex:1; justify-content:center;"><i class="fa-solid fa-code"></i> JSON İndir</button>
                    <button class="btn" id="import-json-btn-modal" style="flex:1; justify-content:center;"><i class="fa-solid fa-file-import"></i> JSON Yükle</button>
                </div>
                <input type="file" id="import-file-input" accept=".json" style="display:none;">
            </div>

            <div class="modal-buttons" style="margin-top: 16px;">
                <button class="btn btn-primary" id="settings-close" style="width:100%; justify-content:center;">Kapat</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-radio"></i>
                </div>
                <div class="brand-title">
                    <h1>Symphony Radio</h1>
                    <p>Dünya Radyoları & Canlı Oynatıcı</p>
                </div>
            </div>
            <div class="header-controls">
                <button class="btn btn-icon-only" id="theme-toggle" title="Karanlık/Aydınlık Mod">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button class="btn btn-icon-only" id="settings-btn" title="Modern Ayarlar Paneli">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- Search Panel -->
        <div class="search-panel">
            <div class="search-row">
                <div class="input-group">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" class="input-field" placeholder="Radyo adı ara...">
                </div>

                <select id="country-select" class="select-field">
                    <option value="">Tüm Ülkeler</option>
                </select>

                <select id="limit-select" class="select-field">
                    <option value="50">50 Sonuç</option>
                    <option value="100">100 Sonuç</option>
                    <option value="200">200 Sonuç</option>
                    <option value="1000" selected>Tüm Liste (Tümü)</option>
                </select>

                <button class="btn btn-primary" id="search-btn">
                    <i class="fa-solid fa-sliders"></i> Ara
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-btn active" data-tab="all">
                    <i class="fa-solid fa-globe"></i> Tüm Radyolar
                </button>
                <button class="tab-btn" data-tab="favorites">
                    <i class="fa-solid fa-heart"></i> Favorilerim (<span id="fav-count">0</span>)
                </button>
                <button class="tab-btn" data-tab="history">
                    <i class="fa-solid fa-clock-rotate-left"></i> Son Dinlenenler
                </button>
            </div>
        </div>

        <!-- Radio Grid -->
        <div id="stations-grid" class="stations-grid">
            <div class="loading-state">
                <i class="fa-solid fa-circle-notch spinner"></i>
                <p>Radyo istasyonları yükleniyor...</p>
            </div>
        </div>
    </div>

    <!-- Web Audio API Visualizer -->
    <div class="visualizer-wrapper">
        <canvas id="visualizer-canvas"></canvas>
    </div>

    <!-- Floating Audio Player Bar -->
    <div class="player-bar">
        <div class="now-playing">
            <img id="player-img" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&q=80" class="now-playing-img" alt="Logo">
            <div class="now-playing-meta">
                <div id="player-title" class="now-playing-title">Bir Radyo Seçin</div>
                <div id="player-sub" class="now-playing-sub">Canlı Yayın Bekleniyor...</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <button class="btn btn-icon-only" id="prev-btn" title="Önceki Kanal">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button class="play-btn" id="main-play-btn" title="Oynat / Durdur (Space)">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="btn btn-icon-only" id="next-btn" title="Sonraki Kanal">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button class="btn btn-icon-only" id="shuffle-btn" title="Rastgele Kanal Çal">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button class="btn btn-icon-only record-btn" id="record-btn" title="Canlı Yayını Kaydet">
                    <i class="fa-solid fa-circle"></i>
                </button>
                <button class="btn btn-icon-only" id="sleep-btn" title="Uyku Zamanlayıcısı">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>

        <div class="extra-controls">
            <select id="eq-preset" class="eq-select" title="Ekolayzır Modu">
                <option value="flat">Ekolayzır: Düz</option>
                <option value="bass">Bass Boost</option>
                <option value="pop">Pop</option>
                <option value="rock">Rock</option>
                <option value="vocal">Net Ses</option>
            </select>

            <button class="btn btn-icon-only" id="player-fav-btn">
                <i class="fa-regular fa-heart"></i>
            </button>
            
            <div class="volume-box">
                <i id="volume-icon" class="fa-solid fa-volume-high" title="Sesi Kapat / Aç (M)"></i>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
            </div>
        </div>
    </div>

    <!-- HTML5 Audio Element -->
    <audio id="audio-engine" crossorigin="anonymous" preload="none"></audio>

    <script>
        const API_SERVERS = [
            'https://all.api.radio-browser.info/json',
            'https://de1.api.radio-browser.info/json',
            'https://nl1.api.radio-browser.info/json',
            'https://at1.api.radio-browser.info/json'
        ];

        let currentStations = [];
        let favorites = JSON.parse(localStorage.getItem('symphony_favs') || '[]');
        let history = JSON.parse(localStorage.getItem('symphony_history') || '[]');
        let customStations = JSON.parse(localStorage.getItem('symphony_custom') || '[]');
        let offlineStations = JSON.parse(localStorage.getItem('symphony_offline') || '{}');
        
        let currentStation = null;
        let activeTab = 'all';

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let sleepTimerId = null;

        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;
        let biquadFilter = null;

        const audioEngine = document.getElementById('audio-engine');
        const grid = document.getElementById('stations-grid');
        const searchInput = document.getElementById('search-input');
        const countrySelect = document.getElementById('country-select');
        const limitSelect = document.getElementById('limit-select');
        const searchBtn = document.getElementById('search-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const settingsBtn = document.getElementById('settings-btn');
        const favCountSpan = document.getElementById('fav-count');

        const playerTitle = document.getElementById('player-title');
        const playerSub = document.getElementById('player-sub');
        const playerImg = document.getElementById('player-img');
        const mainPlayBtn = document.getElementById('main-play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const playerFavBtn = document.getElementById('player-fav-btn');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeIcon = document.getElementById('volume-icon');
        const recordBtn = document.getElementById('record-btn');
        const sleepBtn = document.getElementById('sleep-btn');
        const eqPresetSelect = document.getElementById('eq-preset');

        const canvas = document.getElementById('visualizer-canvas');
        const canvasCtx = canvas.getContext('2d');

        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            updateFavCount();
            await populateFilters();
            await fetchStations();
            setupEventListeners();
            setupKeyboardShortcuts();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = 40;
        }

        async function apiFetch(endpoint) {
            for (let server of API_SERVERS) {
                try {
                    const response = await fetch(`${server}/${endpoint}`, { timeout: 5000 });
                    if (response.ok) return await response.json();
                } catch (e) {
                    console.warn(`Server fallback triggered: ${server}`);
                }
            }
            throw new Error('Tüm radyo sunucularına erişim başarısız oldu.');
        }

        async function populateFilters() {
            try {
                const countries = await apiFetch('countries');
                countries.sort((a, b) => a.name.localeCompare(b.name));
                countries.forEach(c => {
                    if (c.stationcount > 5) {
                        const opt = document.createElement('option');
                        opt.value = c.name;
                        opt.textContent = `${c.name} (${c.stationcount})`;
                        if (c.name.toLowerCase() === 'turkey') {
                            opt.selected = true;
                        }
                        countrySelect.appendChild(opt);
                    }
                });
            } catch (err) {
                showToast('Ülke listesi yüklenemedi.', 'error');
            }
        }

        async function fetchStations() {
            grid.innerHTML = `
                <div class="loading-state">
                    <i class="fa-solid fa-circle-notch spinner"></i>
                    <p>Radyo istasyonları yükleniyor...</p>
                </div>
            `;

            const query = searchInput.value.trim();
            const country = countrySelect.value || 'Turkey';
            const limit = limitSelect.value;

            let params = [`limit=${limit}`, 'order=clickcount', 'reverse=true', 'hidebroken=true'];

            if (query) {
                params.push(`name=${encodeURIComponent(query)}`);
            } else if (country) {
                params.push(`country=${encodeURIComponent(country)}`);
            }

            try {
                const data = await apiFetch(`stations/search?${params.join('&')}`);
                currentStations = [...customStations, ...data];
                renderStations();
            } catch (err) {
                currentStations = [...customStations];
                renderStations();
                showToast('İnternet bağlantısı sınırlı.', 'error');
            }
        }

        function getActiveList() {
            if (activeTab === 'favorites') return favorites;
            if (activeTab === 'history') return history;
            return currentStations;
        }

        function renderStations() {
            let listToRender = getActiveList();

            if (!listToRender || listToRender.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-radio" style="font-size:32px; margin-bottom:10px;"></i>
                        <p>Gösterilecek radyo istasyonu bulunamadı.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = listToRender.map(st => {
                const isFav = favorites.some(f => f.changeuuid === st.changeuuid);
                const isPlaying = currentStation && (currentStation.changeuuid === st.changeuuid) && !audioEngine.paused;
                
                let statusClass = 'online';
                if (offlineStations[st.changeuuid] || (currentStation && currentStation.changeuuid === st.changeuuid && audioEngine.error)) {
                    statusClass = 'offline';
                }

                const tags = st.tags ? st.tags.split(',').slice(0, 2) : [];
                const logo = st.favicon && st.favicon.startsWith('http') ? st.favicon : '';

                return `
                    <div class="station-card ${isPlaying ? 'playing' : ''}" onclick="playStation('${st.changeuuid}')">
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${st.changeuuid}')">
                            <i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>
                        </button>

                        <div class="card-header">
                            <div class="station-logo-wrap">
                                ${logo ? `<img src="${logo}" class="station-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : ''}
                                <i class="fa-solid fa-radio station-logo-fallback" style="${logo ? 'display:none;' : ''}"></i>
                                <div class="status-dot ${statusClass}" title="${statusClass === 'online' ? 'Bağlantı Sağlıklı' : 'Kanal Çevrimdışı'}"></div>
                            </div>
                            <div class="card-info">
                                <div class="station-title" title="${escapeHtml(st.name)}">${escapeHtml(st.name)}</div>
                                <div class="station-country">
                                    <i class="fa-solid fa-location-dot"></i> ${st.country || 'Özel Kanal'}
                                </div>
                            </div>
                        </div>

                        <div class="card-tags">
                            ${tags.map(t => `<span class="tag-badge">${escapeHtml(t.trim())}</span>`).join('')}
                        </div>

                        <div class="card-footer">
                            <span><i class="fa-solid fa-headphones"></i> ${(st.clickcount || 0).toLocaleString()} dinlenme</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- Web Audio Visualizer ---
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 128;

                biquadFilter = audioCtx.createBiquadFilter();
                biquadFilter.type = 'lowshelf';

                sourceNode = audioCtx.createMediaElementSource(audioEngine);
                sourceNode.connect(biquadFilter);
                biquadFilter.connect(analyser);
                analyser.connect(audioCtx.destination);

                drawVisualizer();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 1.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height;

                const gradient = canvasCtx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#6366f1');
                gradient.addColorStop(0.5, '#06b6d4');
                gradient.addColorStop(1, '#ec4899');

                canvasCtx.fillStyle = gradient;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);

                x += barWidth;
            }
        }

        eqPresetSelect.addEventListener('change', (e) => {
            if (!biquadFilter) return;
            const val = e.target.value;
            if (val === 'bass') {
                biquadFilter.type = 'lowshelf';
                biquadFilter.frequency.value = 200;
                biquadFilter.gain.value = 8;
            } else if (val === 'pop') {
                biquadFilter.type = 'peaking';
                biquadFilter.frequency.value = 1000;
                biquadFilter.gain.value = 4;
            } else if (val === 'rock') {
                biquadFilter.type = 'highshelf';
                biquadFilter.frequency.value = 3000;
                biquadFilter.gain.value = 6;
            } else {
                biquadFilter.gain.value = 0;
            }
            showToast(`Ekolayzır: ${e.target.options[e.target.selectedIndex].text}`, 'success');
        });

        // --- Audio Playback & Navigation ---
        function playStation(uuid) {
            let list = getActiveList();
            let st = list.find(s => s.changeuuid === uuid) 
                  || currentStations.find(s => s.changeuuid === uuid) 
                  || favorites.find(s => s.changeuuid === uuid) 
                  || history.find(s => s.changeuuid === uuid)
                  || customStations.find(s => s.changeuuid === uuid);

            if (!st) return;

            currentStation = st;
            initAudioContext();

            if (offlineStations[st.changeuuid]) {
                delete offlineStations[st.changeuuid];
                localStorage.setItem('symphony_offline', JSON.stringify(offlineStations));
            }

            const primaryUrl = st.url_resolved || st.url;
            const fallbackUrl = st.url || st.url_resolved;

            audioEngine.src = primaryUrl;
            audioEngine.play().then(() => {
                updatePlayerUI(true);
                addToHistory(st);
            }).catch(err => {
                console.warn('Birincil akış başarısız, yedek deneniyor...');
                if (fallbackUrl && fallbackUrl !== primaryUrl) {
                    audioEngine.src = fallbackUrl;
                    audioEngine.play().then(() => {
                        updatePlayerUI(true);
                        addToHistory(st);
                    }).catch(() => handlePlayError(st.changeuuid));
                } else {
                    handlePlayError(st.changeuuid);
                }
            });

            updatePlayerUI(true);
            renderStations();
        }

        function handlePlayError(uuid) {
            offlineStations[uuid] = true;
            localStorage.setItem('symphony_offline', JSON.stringify(offlineStations));
            showToast('Kanal bağlantı kuramadı (Çevrimdışı).', 'error');
            updatePlayerUI(false);
            renderStations();
        }

        function updatePlayerUI(isPlaying) {
            if (!currentStation) return;

            playerTitle.textContent = currentStation.name;
            playerSub.textContent = `${currentStation.country || 'Özel Kanal'}`;
            
            if (currentStation.favicon && currentStation.favicon.startsWith('http')) {
                playerImg.src = currentStation.favicon;
            } else {
                playerImg.src = 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100&q=80';
            }

            mainPlayBtn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';

            const isFav = favorites.some(f => f.changeuuid === currentStation.changeuuid);
            playerFavBtn.innerHTML = `<i class="fa-${isFav ? 'solid' : 'regular'} fa-heart"></i>`;
            playerFavBtn.style.color = isFav ? 'var(--danger-color)' : '';
        }

        function changeChannel(direction) {
            let list = getActiveList();
            if (!list || list.length === 0) return;

            let currentIndex = list.findIndex(s => currentStation && s.changeuuid === currentStation.changeuuid);
            if (currentIndex === -1) {
                playStation(list[0].changeuuid);
                return;
            }

            let newIndex = currentIndex + direction;
            if (newIndex >= list.length) newIndex = 0;
            if (newIndex < 0) newIndex = list.length - 1;

            playStation(list[newIndex].changeuuid);
        }

        prevBtn.addEventListener('click', () => changeChannel(-1));
        nextBtn.addEventListener('click', () => changeChannel(1));

        shuffleBtn.addEventListener('click', () => {
            let list = getActiveList();
            if (!list || list.length === 0) return;
            let randomIndex = Math.floor(Math.random() * list.length);
            playStation(list[randomIndex].changeuuid);
            showToast('Rastgele kanal çalınıyor...', 'success');
        });

        mainPlayBtn.addEventListener('click', () => {
            if (!audioEngine.src) {
                let list = getActiveList();
                if (list.length > 0) playStation(list[0].changeuuid);
                return;
            }
            initAudioContext();
            if (audioEngine.paused) {
                audioEngine.play();
                updatePlayerUI(true);
            } else {
                audioEngine.pause();
                updatePlayerUI(false);
            }
            renderStations();
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            audioEngine.volume = val;
            updateVolumeIcon(val);
        });

        function updateVolumeIcon(val) {
            if (val == 0) volumeIcon.className = 'fa-solid fa-volume-xmark';
            else if (val < 0.5) volumeIcon.className = 'fa-solid fa-volume-low';
            else volumeIcon.className = 'fa-solid fa-volume-high';
        }

        volumeIcon.addEventListener('click', () => {
            if (audioEngine.volume > 0) {
                audioEngine.dataset.lastVolume = audioEngine.volume;
                audioEngine.volume = 0;
                volumeSlider.value = 0;
                updateVolumeIcon(0);
            } else {
                const lastVol = audioEngine.dataset.lastVolume || 0.8;
                audioEngine.volume = lastVol;
                volumeSlider.value = lastVol;
                updateVolumeIcon(lastVol);
            }
        });

        // --- Stream Recording ---
        recordBtn.addEventListener('click', () => {
            if (!audioEngine.src || audioEngine.paused) {
                showToast('Önce bir radyo yayını başlatmalısınız.', 'error');
                return;
            }

            if (!isRecording) {
                try {
                    const stream = audioEngine.captureStream ? audioEngine.captureStream() : audioEngine.mozCaptureStream();
                    mediaRecorder = new MediaRecorder(stream);
                    recordedChunks = [];

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                        downloadBlob(blob, `${currentStation.name || 'radyo'}_kayit.webm`);
                        showToast('Canlı kayıt dosyası indirildi!', 'success');
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    showToast('Yayın kaydediliyor...', 'success');
                } catch (err) {
                    showToast('Tarayıcınız ses kaydını desteklemiyor.', 'error');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.classList.remove('recording');
            }
        });

        // --- Sleep Timer ---
        sleepBtn.addEventListener('click', () => {
            if (sleepTimerId) {
                clearTimeout(sleepTimerId);
                sleepTimerId = null;
                sleepBtn.style.color = '';
                showToast('Uyku zamanlayıcısı iptal edildi.', 'success');
            } else {
                const mins = prompt('Kaç dakika sonra radyo kapatılsın? (ör: 15, 30, 60)', '30');
                if (mins && !isNaN(mins) && mins > 0) {
                    sleepTimerId = setTimeout(() => {
                        audioEngine.pause();
                        updatePlayerUI(false);
                        renderStations();
                        showToast('Uyku zamanlayıcısı radyoyu durdurdu.', 'success');
                        sleepBtn.style.color = '';
                        sleepTimerId = null;
                    }, mins * 60 * 1000);
                    sleepBtn.style.color = 'var(--accent-secondary)';
                    showToast(`${mins} dakikalık uyku zamanlayıcısı aktif.`, 'success');
                }
            }
        });

        // --- Settings Modal & Custom Stream ---
        const settingsModal = document.getElementById('settings-modal');
        document.getElementById('settings-btn').addEventListener('click', () => settingsModal.classList.add('show'));
        document.getElementById('settings-close').addEventListener('click', () => settingsModal.classList.remove('show'));

        document.getElementById('custom-save').addEventListener('click', () => {
            const name = document.getElementById('custom-name').value.trim();
            const url = document.getElementById('custom-url').value.trim();
            const country = document.getElementById('custom-country').value.trim() || 'Özel Kanal';

            if (!name || !url) {
                showToast('Lütfen radyo adı ve yayın adresini girin.', 'error');
                return;
            }

            const newStation = {
                changeuuid: 'custom_' + Date.now(),
                name: name,
                url: url,
                url_resolved: url,
                country: country,
                tags: 'özel, kullanıcı',
                clickcount: 1
            };

            customStations.push(newStation);
            localStorage.setItem('symphony_custom', JSON.stringify(customStations));
            document.getElementById('custom-name').value = '';
            document.getElementById('custom-url').value = '';
            document.getElementById('custom-country').value = '';
            settingsModal.classList.remove('show');
            fetchStations();
            showToast('Özel radyo başarıyla eklendi!', 'success');
        });

        // --- Favorites & Import/Export Backup ---
        function toggleFav(e, uuid) {
            e.stopPropagation();
            let list = getActiveList();
            let st = list.find(s => s.changeuuid === uuid) 
                  || currentStations.find(s => s.changeuuid === uuid) 
                  || favorites.find(s => s.changeuuid === uuid) 
                  || history.find(s => s.changeuuid === uuid)
                  || customStations.find(s => s.changeuuid === uuid);

            if (!st) return;

            const index = favorites.findIndex(f => f.changeuuid === st.changeuuid);
            if (index > -1) {
                favorites.splice(index, 1);
                showToast('Favorilerden çıkarıldı.', 'success');
            } else {
                favorites.push(st);
                showToast('Favorilere eklendi!', 'success');
            }

            localStorage.setItem('symphony_favs', JSON.stringify(favorites));
            updateFavCount();
            renderStations();

            if (currentStation && currentStation.changeuuid === uuid) {
                updatePlayerUI(!audioEngine.paused);
            }
        }

        playerFavBtn.addEventListener('click', (e) => {
            if (currentStation) toggleFav(e, currentStation.changeuuid);
        });

        function updateFavCount() {
            favCountSpan.textContent = favorites.length;
        }

        function addToHistory(st) {
            history = history.filter(h => h.changeuuid !== st.changeuuid);
            history.unshift(st);
            if (history.length > 30) history.pop();
            localStorage.setItem('symphony_history', JSON.stringify(history));
        }

        document.getElementById('import-json-btn-modal').addEventListener('click', () => {
            document.getElementById('import-file-input').click();
        });

        document.getElementById('import-file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedFavs = JSON.parse(event.target.result);
                    if (Array.isArray(importedFavs)) {
                        favorites = importedFavs;
                        localStorage.setItem('symphony_favs', JSON.stringify(favorites));
                        updateFavCount();
                        renderStations();
                        showToast('Favori yedeği yüklendi!', 'success');
                    } else {
                        throw new Error();
                    }
                } catch (err) {
                    showToast('Geçersiz dosya formatı.', 'error');
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('export-json-modal').addEventListener('click', () => {
            if (favorites.length === 0) {
                showToast('Yedeklenecek favori bulunmuyor.', 'error');
                return;
            }
            const blob = new Blob([JSON.stringify(favorites, null, 2)], { type: 'application/json' });
            downloadBlob(blob, 'symphony_favoriler_yedek.json');
            showToast('Yedek JSON dosyası indirildi.', 'success');
        });

        // --- Keyboard Shortcuts ---
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                if (e.code === 'Space') {
                    e.preventDefault();
                    mainPlayBtn.click();
                } else if (e.code === 'KeyM') {
                    volumeIcon.click();
                } else if (e.code === 'ArrowRight') {
                    e.preventDefault();
                    changeChannel(1);
                } else if (e.code === 'ArrowLeft') {
                    e.preventDefault();
                    changeChannel(-1);
                } else if (e.code === 'ArrowUp') {
                    e.preventDefault();
                    let newVol = Math.min(1, audioEngine.volume + 0.05);
                    audioEngine.volume = newVol;
                    volumeSlider.value = newVol;
                    updateVolumeIcon(newVol);
                } else if (e.code === 'ArrowDown') {
                    e.preventDefault();
                    let newVol = Math.max(0, audioEngine.volume - 0.05);
                    audioEngine.volume = newVol;
                    volumeSlider.value = newVol;
                    updateVolumeIcon(newVol);
                }
            });
        }

        function setupEventListeners() {
            searchBtn.addEventListener('click', () => fetchStations());

            let timeout = null;
            searchInput.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(() => fetchStations(), 500);
            });

            countrySelect.addEventListener('change', () => fetchStations());
            limitSelect.addEventListener('change', () => fetchStations());

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeTab = btn.dataset.tab;
                    renderStations();
                });
            });

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.body.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.body.setAttribute('data-theme', newTheme);
                themeToggle.innerHTML = newTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
                localStorage.setItem('symphony_theme', newTheme);
            });

            audioEngine.onerror = () => {
                if (currentStation) handlePlayError(currentStation.changeuuid);
            };
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('symphony_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            themeToggle.innerHTML = savedTheme === 'light' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const toastMsg = document.getElementById('toast-msg');

            toastMsg.textContent = msg;
            toast.className = `toast ${type} show`;
            icon.className = type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check';

            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
