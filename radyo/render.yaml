services:
  - type: web
    name: online-radyo-sunucu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: STREAM_PROXY_ALLOWED_HOSTS
        value: sslyayin.netyayin.net
      - key: RECORD_ALLOWED_HOSTS
        value: sslyayin.netyayin.net
