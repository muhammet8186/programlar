<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PMR Tactical Pro - LiveKit Edition (50+ User)</title>
    <!-- LiveKit Web Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            background: radial-gradient(circle at center, #061a10 0%, #020804 100%);
        }
        .font-lcd { font-family: 'Chakra Petch', monospace; }
        .glow-green { text-shadow: 0 0 16px rgba(16, 185, 129, 0.8); }
        .glow-red { text-shadow: 0 0 16px rgba(239, 68, 68, 0.8); }
        .glow-amber { text-shadow: 0 0 16px rgba(245, 158, 11, 0.8); }
        .btn-pressed {
            transform: scale(0.96);
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.8), inset 0 0 25px rgba(0,0,0,0.6) !important;
        }
        .screen-glass {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.05) 0%, rgba(0, 0, 0, 0.6) 100%);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
        }
        #pttBtn { touch-action: none; }
    </style>
</head>
<body class="h-full w-full flex flex-col justify-between p-3 md:p-5 select-none overflow-hidden text-slate-100">

    <!-- BİLDİRİM KAPSAYICISI -->
    <div id="toastContainer" class="fixed top-4 right-4 z-[999] flex flex-col gap-2 pointer-events-none"></div>

    <!-- ÜST BAR -->
    <header class="w-full flex items-center justify-between gap-2 z-20">
        <button id="powerBtn" type="button" class="flex items-center gap-2 bg-slate-800/80 border border-slate-600/60 text-slate-200 font-bold px-3 py-2 rounded-2xl shadow-lg">
            <span id="powerLed" class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.9)] animate-pulse"></span>
            <span id="powerText" class="text-[11px] font-lcd font-bold">AÇIK</span>
        </button>

        <div class="text-xs font-lcd text-amber-400 font-bold">LIVEKIT SFU MODU</div>

        <button id="openChannelModalBtn" type="button" class="bg-gradient-to-r from-amber-600 to-amber-500 text-slate-950 font-black px-3 py-2 rounded-2xl font-lcd text-[11px]">
            MENÜ / KANAL
        </button>
    </header>

    <!-- ORTA ALAN: LCD EKRAN -->
    <main class="relative my-2 flex-1 w-full rounded-3xl border-2 border-slate-700/70 screen-glass p-4 flex flex-col justify-between overflow-hidden shadow-2xl">
        <!-- EKRAN ÜST BİLGİ -->
        <div class="flex justify-between items-center z-10 font-lcd">
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400 font-bold">KANAL:</span>
                <span id="currentRoomDisplay" class="text-base text-emerald-400 font-black glow-green">BAĞLANILMADI</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-slate-400 font-bold">TX</span>
                <span id="ledTx" class="w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700"></span>
            </div>
        </div>

        <!-- EKRAN ORTA -->
        <div class="text-center z-10 my-auto flex flex-col items-center justify-center">
            <div id="lcdStatus" class="text-2xl md:text-4xl font-black font-lcd tracking-widest text-amber-400 glow-amber">GİRİŞ BEKLENİYOR</div>
            <div id="activeSpeaker" class="text-xs md:text-sm text-amber-300 font-bold mt-1 h-5 truncate max-w-sm">Lütfen bir kanala bağlanın</div>
        </div>

        <!-- EKRAN ALT BİLGİ -->
        <div class="flex justify-between items-center z-10 font-lcd text-[11px] border-t border-slate-800/80 pt-2">
            <div>OPERATÖR: <span id="userCallsignDisplay" class="text-amber-400 font-bold">-</span></div>
            <div>KATILIMCI: <span id="onlineCountLabel" class="text-emerald-400 font-bold">0 Kişi</span></div>
        </div>
    </main>

    <!-- ALT BAR / PTT -->
    <footer class="w-full flex flex-col items-center gap-2 z-20">
        <div class="w-full max-w-md flex justify-center py-0.5">
            <button id="pttBtn" type="button" class="w-full h-24 rounded-3xl bg-gradient-to-r from-red-600 via-red-500 to-red-700 border-2 border-red-400/40 shadow-lg flex items-center justify-center gap-3 text-white cursor-pointer select-none">
                <span class="text-2xl font-black font-lcd tracking-widest" id="pttButtonText">PTT BAS-KONUŞ</span>
            </button>
        </div>
    </footer>

    <!-- MENÜ MODALI -->
    <div id="channelModal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 z-50">
        <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-3xl p-5 flex flex-col gap-3 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <h3 class="text-sm font-black font-lcd text-amber-400">LIVEKIT KANAL AYARLARI</h3>
                <button id="closeChannelModalBtn" type="button" class="text-slate-400 text-2xl">&times;</button>
            </div>

            <div class="flex flex-col gap-2 text-xs">
                <label class="text-slate-400 font-bold">LiveKit Sunucu Adresi (WS/WSS)</label>
                <input type="text" id="wsUrlInput" placeholder="wss://your-project.livekit.cloud" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono">

                <label class="text-slate-400 font-bold">Erişim Jetonu (Token)</label>
                <input type="text" id="tokenInput" placeholder="eyJhbGciOi..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono">

                <label class="text-slate-400 font-bold">Kullanıcı Adı / Çağrı Kodu</label>
                <input type="text" id="usernameInput" value="Operatör-1" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white">

                <button id="connectBtn" type="button" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs font-lcd mt-2">KANALA BAĞLAN</button>
                <button id="disconnectBtn" type="button" class="w-full bg-red-950 hover:bg-red-900 text-red-300 font-bold py-2 rounded-xl text-xs font-lcd hidden">BAĞLANTIYI KES</button>
            </div>
        </div>
    </div>

    <!-- SES ELEMANLARI KAPSAYICISI (LiveKit gelen sesleri buraya bağlar) -->
    <div id="audioContainer" class="hidden"></div>

    <script>
        // LiveKit Nesnesi
        let room = null;
        let localAudioTrack = null;
        let isTransmitting = false;

        const pttBtn = document.getElementById('pttBtn');
        const pttButtonText = document.getElementById('pttButtonText');
        const lcdStatus = document.getElementById('lcdStatus');
        const activeSpeaker = document.getElementById('activeSpeaker');
        const currentRoomDisplay = document.getElementById('currentRoomDisplay');
        const userCallsignDisplay = document.getElementById('userCallsignDisplay');
        const onlineCountLabel = document.getElementById('onlineCountLabel');
        const ledTx = document.getElementById('ledTx');
        const channelModal = document.getElementById('channelModal');

        function showToast(msg) {
            alert(msg); // Basit test uyarısı
        }

        document.getElementById('openChannelModalBtn').onclick = () => channelModal.classList.remove('hidden');
        document.getElementById('closeChannelModalBtn').onclick = () => channelModal.classList.add('hidden');

        // LiveKit Sunucusuna Bağlantı
        document.getElementById('connectBtn').onclick = async () => {
            const url = document.getElementById('wsUrlInput').value.trim();
            const token = document.getElementById('tokenInput').value.trim();
            const userName = document.getElementById('usernameInput').value.trim();

            if (!url || !token) {
                alert("Lütfen LiveKit Sunucu URL'sini ve Token bilgisini girin.");
                return;
            }

            try {
                room = new LivekitClient.Room({
                    adaptiveStream: true,
                    dynacast: true
                });

                // Gelen Ses Akışlarını Dinle ve Otomatik Oynat
                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === LivekitClient.Track.Kind.Audio) {
                        const audioElement = track.attach();
                        document.getElementById('audioContainer').appendChild(audioElement);
                    }
                });

                // Ses Akışı Ayrıldığında Temizle
                room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                });

                // Katılımcı Sayısı Değiştiğinde Güncelle
                room.on(LivekitClient.RoomEvent.ParticipantConnected, updateParticipants);
                room.on(LivekitClient.RoomEvent.ParticipantDisconnected, updateParticipants);

                // Konuşan Kişiyi Ekran Üzerinde Göster
                room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
                    if (speakers.length > 0) {
                        const speakerNames = speakers.map(s => s.identity).join(', ');
                        activeSpeaker.innerText = "KONUŞAN: " + speakerNames;
                        if (!isTransmitting) {
                            lcdStatus.innerText = "ALINIYOR";
                            lcdStatus.className = "text-2xl md:text-4xl font-black font-lcd tracking-widest text-emerald-400 glow-green";
                        }
                    } else {
                        activeSpeaker.innerText = "Kanal Açık";
                        if (!isTransmitting) {
                            lcdStatus.innerText = "BEKLEMEDE";
                            lcdStatus.className = "text-2xl md:text-4xl font-black font-lcd tracking-widest text-emerald-400 glow-green";
                        }
                    }
                });

                await room.connect(url, token);
                
                currentRoomDisplay.innerText = room.name || "ODADA";
                userCallsignDisplay.innerText = userName.toUpperCase();
                lcdStatus.innerText = "BEKLEMEDE";
                lcdStatus.className = "text-2xl md:text-4xl font-black font-lcd tracking-widest text-emerald-400 glow-green";
                
                document.getElementById('connectBtn').classList.add('hidden');
                document.getElementById('disconnectBtn').classList.remove('hidden');
                channelModal.classList.add('hidden');

                updateParticipants();

            } catch (err) {
                alert("LiveKit Bağlantı Hatası: " + err.message);
            }
        };

        // Katılımcı Sayısı
        function updateParticipants() {
            if (!room) return;
            const count = room.remoteParticipants.size + 1; // +1 kendisi
            onlineCountLabel.innerText = count + " Kişi";
        }

        // PTT (Bas-Konuş) Yayınını Başlatma
        async function startTransmission() {
            if (!room || isTransmitting) return;
            try {
                isTransmitting = true;
                localAudioTrack = await LivekitClient.createLocalAudioTrack({
                    echoCancellation: true,
                    noiseSuppression: true
                });

                await room.localParticipant.publishTrack(localAudioTrack);

                pttBtn.classList.add('btn-pressed');
                ledTx.className = "w-2.5 h-2.5 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.9)]";
                lcdStatus.innerText = "YAYINDA";
                lcdStatus.className = "text-2xl md:text-4xl font-black font-lcd tracking-widest text-red-500 glow-red";
                pttButtonText.innerText = "YAYINDA";
            } catch (err) {
                console.error("Mikrofon hatası:", err);
                isTransmitting = false;
            }
        }

        // PTT (Bas-Konuş) Yayınını Durdurma
        async function stopTransmission() {
            if (!room || !isTransmitting) return;
            try {
                if (localAudioTrack) {
                    await room.localParticipant.unpublishTrack(localAudioTrack);
                    localAudioTrack.stop();
                    localAudioTrack = null;
                }
                isTransmitting = false;

                pttBtn.classList.remove('btn-pressed');
                ledTx.className = "w-2.5 h-2.5 rounded-full bg-slate-800 border border-slate-700";
                lcdStatus.innerText = "BEKLEMEDE";
                lcdStatus.className = "text-2xl md:text-4xl font-black font-lcd tracking-widest text-emerald-400 glow-green";
                pttButtonText.innerText = "PTT BAS-KONUŞ";
            } catch (err) {
                console.error("Yayın durdurma hatası:", err);
            }
        }

        // Buton ve Klavye Olayları
        pttBtn.addEventListener('pointerdown', startTransmission);
        window.addEventListener('pointerup', stopTransmission);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                startTransmission();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                stopTransmission();
            }
        });

        // Çıkış Yapma
        document.getElementById('disconnectBtn').onclick = () => {
            if (room) {
                room.disconnect();
                room = null;
            }
            document.getElementById('connectBtn').classList.remove('hidden');
            document.getElementById('disconnectBtn').classList.add('hidden');
            lcdStatus.innerText = "GİRİŞ BEKLENİYOR";
            currentRoomDisplay.innerText = "BAĞLANILMADI";
            onlineCountLabel.innerText = "0 Kişi";
        };
    </script>
</body>
</html>
