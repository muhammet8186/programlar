    <!-- SOHBET UYGULAMASI MANTIĞI (JAVASCRIPT) -->
    <script>
        // Örnek Veri Seti (Sohbetler ve Mesajlar)
        let currentTab = 'all';
        let activeChatId = 1;

        const chatsData = [
            {
                id: 1,
                name: "Ahmet Yılmaz",
                avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&auto=format&fit=crop&q=80",
                status: "online",

                messages: [

                    { id: 103, text: "Süper! Arayüz tasarımlarını merakla bekliyorum.", sender: "them", time: "10:16", status: "read" }
                ]
            },
            {
                id: 2,
                name: "Tasarım Ekibi",
                avatar: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=100&auto=format&fit=crop&q=80",
                status: "online",
                isGroup: true,
                isFavorite: true,
                unreadCount: 0,
                autoReplies: [
                    "Ekip arkadaşları yeni revizyonları paylaştı.",
                    "Toplantı saati 15:00 olarak güncellendi."
                ],
                messages: [
                    { id: 201, text: "Yeni renk paleti dokümanı eklendi.", sender: "them", time: "Dün", status: "read" },
                    { id: 202, text: "Elinize sağlık, kontrol ediyorum.", sender: "me", time: "Dün", status: "read" }
                ]
            },
            {
                id: 3,
                name: "Elif Demir",
                avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80",
                status: "offline",
                isGroup: false,
                isFavorite: false,
                unreadCount: 0,
                autoReplies: [
                    "Şu an müsait değilim, daha sonra yazabilir misin?",
                    "Teşekkürler!"
                ],
                messages: [
                    { id: 301, text: "Kahve molasına çıkıyor muyuz?", sender: "them", time: "09:30", status: "read" },
                    { id: 302, text: "10 dakika sonra gelebilirim!", sender: "me", time: "09:32", status: "read" }
                ]
            },
            {
                id: 4,
                name: "Mehmet Kaya",
                avatar: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&auto=format&fit=crop&q=80",
                status: "away",
                isGroup: false,
                isFavorite: false,
                unreadCount: 1,
                autoReplies: [
                    "Kod incelemesi tamamlandı.",
                    "GitHub repository'e bildirim gönderildi."
                ],
                messages: [
                    { id: 401, text: "API dokümantasyonunu gönderdim.", sender: "them", time: "Pazartesi", status: "delivered" }
                ]
            }
        ];

        // Sayfa Yüklendiğinde Başlatılacak Fonksiyonlar
        window.onload = function() {
            renderChatList();
            setActiveChat(activeChatId);
        };

        // Sohbet Listesini Ekran Değerlerine Göre Oluşturma
        function renderChatList() {
            const chatListElement = document.getElementById('chat-list');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            chatListElement.innerHTML = '';

            const filteredChats = chatsData.filter(chat => {
                const matchesSearch = chat.name.toLowerCase().includes(searchVal);
                if (currentTab === 'groups') return matchesSearch && chat.isGroup;
                if (currentTab === 'favorites') return matchesSearch && chat.isFavorite;
                return matchesSearch;
            });

            if(filteredChats.length === 0) {
                chatListElement.innerHTML = `
                    <div class="p-6 text-center text-gray-400 text-sm">
                        Sohbet bulunamadı.
                    </div>
                `;
                return;
            }

            filteredChats.forEach(chat => {
                const lastMsg = chat.messages[chat.messages.length - 1];
                const lastMsgText = lastMsg ? lastMsg.text : 'Mesaj yok';
                const lastMsgTime = lastMsg ? lastMsg.time : '';
                const isActive = chat.id === activeChatId;

                const chatItem = document.createElement('div');
                chatItem.onclick = () => {
                    setActiveChat(chat.id);
                    if (window.innerWidth < 768) toggleSidebar();
                };
                chatItem.className = `p-3.5 flex items-center space-x-3 cursor-pointer transition hover:bg-gray-50 dark:hover:bg-gray-700/40 ${isActive ? 'bg-brand-50/60 dark:bg-gray-700/60 border-l-4 border-brand-500' : ''}`;

                chatItem.innerHTML = `
                    <div class="relative flex-shrink-0">
                        <img src="${chat.avatar}" alt="${chat.name}" class="w-12 h-12 rounded-full object-cover">
                        <span class="absolute bottom-0 right-0 w-3 h-3 ${getStatusColor(chat.status)} border-2 border-white dark:border-gray-800 rounded-full"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline mb-1">
                            <h4 class="text-sm font-semibold text-gray-900 dark:text-white truncate">${chat.name}</h4>
                            <span class="text-[11px] text-gray-400">${lastMsgTime}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate pr-2">${lastMsgText}</p>
                            ${chat.unreadCount > 0 ? `<span class="bg-brand-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center">${chat.unreadCount}</span>` : ''}
                        </div>
                    </div>
                `;
                chatListElement.appendChild(chatItem);
            });
        }

        // Aktif Sohbeti Ayarlama
        function setActiveChat(id) {
            activeChatId = id;
            const chat = chatsData.find(c => c.id === id);
            if (!chat) return;

            // Okunmadı rozetini sıfırla
            chat.unreadCount = 0;

            // Başlık Güncelleme
            document.getElementById('active-chat-avatar').src = chat.avatar;
            document.getElementById('active-chat-name').innerText = chat.name;
            document.getElementById('active-chat-subtitle').innerText = chat.isGroup ? 'Grup Sohbeti' : (chat.status === 'online' ? 'Çevrimiçi' : 'Çevrimdışı');
            
            const statusDot = document.getElementById('active-chat-status');
            statusDot.className = `absolute bottom-0 right-0 w-3 h-3 ${getStatusColor(chat.status)} border-2 border-white dark:border-gray-800 rounded-full`;

            // Favori Butonu İkonu
            const favIcon = document.getElementById('active-favorite-icon');
            favIcon.className = chat.isFavorite ? "fas fa-star text-yellow-500" : "far fa-star";

            renderMessages();
            renderChatList();
        }

        // Mesajları Oluşturma ve Kaydırma
        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            
            const chat = chatsData.find(c => c.id === activeChatId);
            if (!chat) return;

            // Örnek Tarih Ayracı
            container.innerHTML += `
                <div class="flex justify-center my-2">
                    <span class="bg-gray-200 dark:bg-gray-700/60 text-gray-600 dark:text-gray-300 text-[11px] font-medium px-3 py-1 rounded-full shadow-sm">
                        Bugün
                    </span>
                </div>
            `;

            chat.messages.forEach(msg => {
                const isMe = msg.sender === 'me';
                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex ${isMe ? 'justify-end' : 'justify-start'} mb-3`;

                msgWrapper.innerHTML = `
                    <div class="max-w-[75%] sm:max-w-[65%]">
                        <div class="p-3.5 rounded-2xl text-sm shadow-sm ${
                            isMe 
                            ? 'bg-brand-600 text-white chat-bubble-sent' 
                            : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 chat-bubble-received border border-gray-100 dark:border-gray-700/50'
                        }">
                            <p class="leading-relaxed break-words">${msg.text}</p>
                            <div class="flex items-center justify-end space-x-1 mt-1 text-[10px] ${isMe ? 'text-brand-100' : 'text-gray-400'}">
                                <span>${msg.time}</span>
                                ${isMe ? getStatusTicks(msg.status) : ''}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(msgWrapper);
            });

            // En alta kaydır
            container.scrollTop = container.scrollHeight;
        }

        // Mesaj Gönderme İşlemi
        function handleSendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text) return;

            const chat = chatsData.find(c => c.id === activeChatId);
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            // Yeni Mesaj Ekle
            const newMsg = {
                id: Date.now(),
                text: text,
                sender: 'me',
                time: timeStr,
                status: 'sent'
            };

            chat.messages.push(newMsg);
            input.value = '';
            document.getElementById('emoji-picker').classList.add('hidden');

            renderMessages();
            renderChatList();

            // Mesaj Durumu Simülasyonu (İletildi/Okundu)
            setTimeout(() => {
                newMsg.status = 'read';
                renderMessages();
            }, 1000);

            // Otomatik Yanıt Simülasyonu
            simulateAutoReply(chat);
        }

        // Otomatik Yanıt Simülasyonu
        function simulateAutoReply(chat) {
            setTimeout(() => {
                const now = new Date();
                const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                
                const randomReply = chat.autoReplies[Math.floor(Math.random() * chat.autoReplies.length)];
                
                chat.messages.push({
                    id: Date.now(),
                    text: randomReply,
                    sender: 'them',
                    time: timeStr,
                    status: 'read'
                });

                if (activeChatId === chat.id) {
                    renderMessages();
                } else {
                    chat.unreadCount += 1;
                }
                renderChatList();
            }, 1800);
        }

        // Okundu Tık İkonları
        function getStatusTicks(status) {
            if (status === 'sent') return '<i class="fas fa-check"></i>';
            if (status === 'delivered') return '<i class="fas fa-check-double"></i>';
            if (status === 'read') return '<i class="fas fa-check-double text-blue-300"></i>';

        function getStatusColor(status) {
            switch(status) {

                default: return 'bg-gray-400';

                if (t === tab) {
                    btn.className = "flex-1 py-2.5 text-center border-b-2 border-brand-500 text-brand-600 dark:text-brand-400 font-semibold transition-colors";
                } else {
                    btn.className = "flex-1 py-2.5 text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors";
                }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fas fa-sun text-yellow-500 text-lg';

                html.classList.add('dark');
                icon.className = 'fas fa-moon text-lg';

        // Mobil Kenar Çubuğunu Aç/Kapat
        function toggleSidebar() {

        // Aktif Sohbeti Favorilere Ekle/Çıkar
        function toggleFavoriteCurrent() {
            const chat = chatsData.find(c => c.id === activeChatId);
            if (chat) {
                chat.isFavorite = !chat.isFavorite;
                showToast(chat.isFavorite ? 'Favorilere eklendi' : 'Favorilerden çıkarıldı');
                setActiveChat(activeChatId);

        // Sohbet Temizleme
        function clearChatMessages() {
            const chat = chatsData.find(c => c.id === activeChatId);

        // Dosya Yükleme İllüstrasyonu
        function handleFileUpload(e) {

        // Toast/Bildirim Gösterici
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.innerText = message;
            
            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
