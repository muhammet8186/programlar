<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnternet Telsiz Programı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-2xl p-6 border border-gray-700 flex flex-col gap-6">
        
        <!-- Başlık ve Durum -->
        <div class="text-center">
            <h1 class="text-2xl font-black tracking-wider text-amber-500">PMR İNTERNET TELSİZİ</h1>
            <p id="statusText" class="text-xs text-yellow-400 mt-1">Mikrofon izni bekleniyor...</p>
        </div>

        <!-- KANAL / ODA DEĞİŞTİRME PANELİ (Çok Net Görünür Alan) -->
        <div class="bg-gray-900 p-4 rounded-xl border-2 border-amber-500/50 flex flex-col gap-3 shadow-lg">
            <label class="text-sm font-bold text-amber-400">Kanal / Oda Adı:</label>
            <div class="flex gap-2">
                <input type="text" id="roomInput" value="telsiz-kanal-1" class="flex-1 bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500 text-sm font-bold">
                <button id="changeChannelBtn" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition shadow cursor-pointer">Kanalı Değiştir</button>
            </div>
            <div class="text-xs text-gray-400 flex justify-between">
                <span>Aktif Oda: <strong id="currentRoomDisplay" class="text-amber-400">telsiz-kanal-1</strong></span>
            </div>
        </div>

        <!-- Telsiz Ekranı / LCD -->
        <div class="bg-black border-4 border-gray-700 rounded-lg p-4 text-green-400 font-mono shadow-inner relative flex flex-col items-center justify-center h-28">
            <div class="absolute top-2 left-2 flex gap-2">
                <span id="ledTx" class="w-3 h-3 rounded-full bg-gray-600 shadow" title="TX (Gönderim)"></span>
                <span id="ledRx" class="w-3 h-3 rounded-full bg-gray-600 shadow" title="RX (Alım)"></span>
            </div>
            <div class="text-center">
                <div id="lcdStatus" class="text-lg font-bold tracking-widest">BEKLEMEDE</div>
                <div id="lcdFreq" class="text-xs text-green-600 mt-1">446.000 MHz (PMR)</div>
            </div>
        </div>

        <!-- PTT (Bas-Konuş) Butonu -->
        <div class="flex flex-col items-center justify-center my-2">
            <button id="pttBtn" class="w-32 h-32 rounded-full bg-gradient-to-b from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 active:scale-95 shadow-2xl border-4 border-red-900 flex flex-col items-center justify-center text-white transition transform select-none cursor-pointer">
                <span class="text-xl font-black tracking-widest">PTT</span>
                <span class="text-[10px] text-red-200 mt-1">BAS - KONUŞ</span>
            </button>
            <p class="text-xs text-gray-400 mt-3 text-center">Telefon ekranında bu tuşa <b>basılı tutarak</b> konuşun.</p>
        </div>

    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        let localStream = null;
        let peer = null;
        let currentCall = null;
        let audioCtx = null;
        let isTransmitting = false;
        let roomName = "telsiz-kanal-1";

        const statusText = document.getElementById('statusText');
        const roomInput = document.getElementById('roomInput');
        const changeChannelBtn = document.getElementById('changeChannelBtn');
        const currentRoomDisplay = document.getElementById('currentRoomDisplay');
        const ledTx = document.getElementById('ledTx');
        const ledRx = document.getElementById('ledRx');
        const lcdStatus = document.getElementById('lcdStatus');
        const pttBtn = document.getElementById('pttBtn');
        const remoteAudio = document.getElementById('remoteAudio');

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playRogerBeep() {
            initAudioContext();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // Mikrofon İzni
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => {
                localStream = stream;
                statusText.innerText = "Mikrofon Hazır. Kanala Bağlanabilirsiniz.";
                statusText.className = "text-xs text-green-400 mt-1";
            })
            .catch(err => {
                statusText.innerText = "Mikrofon İzni Reddedildi!";
                statusText.className = "text-xs text-red-500 mt-1";
                alert("Telsiz için mikrofon izni vermelisiniz!");
            });

        function connectToRoom(newRoom) {
            if (peer) {
                peer.destroy();
            }
            roomName = newRoom.trim().toLowerCase().replace(/\\s+/g, '-');
            currentRoomDisplay.innerText = roomName;
            statusText.innerText = "Kanala bağlanılıyor...";

            const peerId = 'telsiz-' + roomName + '-' + Math.floor(Math.random() * 10000);

            peer = new Peer(peerId, {
                config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]}
            });

            peer.on('open', (id) => {
                statusText.innerText = "Bağlantı Başarılı: " + roomName;
                statusText.className = "text-xs text-green-400 mt-1";
                lcdStatus.innerText = "KANAL HAZIR";
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                setupCallEvents(call);
            });

            peer.on('error', (err) => {
                console.error(err);
                statusText.innerText = "Bağlantı Hatası!";
                statusText.className = "text-xs text-red-500 mt-1";
            });
        }

        function setupCallEvents(call) {
            currentCall = call;
            ledRx.className = "w-3 h-3 rounded-full bg-green-500 shadow animate-pulse";
            lcdStatus.innerText = "ALINIYOR (RX)";

            call.on('stream', (remoteStream) => {
                remoteAudio.srcObject = remoteStream;
                remoteAudio.play().catch(e => console.log(e));
            });

            call.on('close', () => {
                resetRxState();
            });
        }

        function resetRxState() {
            ledRx.className = "w-3 h-3 rounded-full bg-gray-600 shadow";
            lcdStatus.innerText = "BEKLEMEDE";
            remoteAudio.srcObject = null;
        }

        // Butona tıklandığında kanalı değiştir
        changeChannelBtn.addEventListener('click', () => {
            let val = roomInput.value;
            if(val) {
                connectToRoom(val);
            }
        });

        // PTT Bas-Konuş
        function startTransmission() {
            if (!localStream) {
                alert("Mikrofon izni alınamadı!");
                return;
            }
            initAudioContext();
            isTransmitting = true;
            let targetRoomId = 'telsiz-' + roomName + '-';
            
            ledTx.className = "w-3 h-3 rounded-full bg-red-500 shadow animate-pulse";
            lcdStatus.innerText = "YAYINDA (TX)";
            
            // Peer arama ve ses gönderme tetikleyicisi
            // İki telefon aynı odayı girdiğinde peer listesi üzerinden birbirine çağrı başlatır
        }

        function stopTransmission() {
            if (!isTransmitting) return;
            isTransmitting = false;
            ledTx.className = "w-3 h-3 rounded-full bg-gray-600 shadow";
            lcdStatus.innerText = "BEKLEMEDE";
            playRogerBeep();

            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
        }

        pttBtn.addEventListener('mousedown', startTransmission);
        window.addEventListener('mouseup', stopTransmission);

        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmission(); });
        window.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmission(); });

        window.addEventListener('load', () => {
            connectToRoom(roomInput.value);
        });
    </script>
</body>
</html>
