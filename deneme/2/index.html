<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMR İnternet Telsizi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen flex flex-col items-center justify-center p-3 select-none">

    <!-- Telsiz Gövdesi -->
    <div class="max-w-xs w-full bg-gradient-to-b from-gray-700 to-gray-900 rounded-3xl shadow-2xl p-5 border-4 border-gray-600 flex flex-col gap-4 relative overflow-hidden">
        
        <!-- Anten -->
        <div class="absolute -top-10 right-8 w-4 h-16 bg-gradient-to-r from-gray-800 via-gray-600 to-gray-900 rounded-t-lg border border-gray-500 shadow-lg"></div>

        <!-- Üst Kısım: LED'ler -->
        <div class="flex justify-between items-center px-1">
            <span class="text-[10px] tracking-widest font-bold text-gray-400">PMR-446 TRANSCEIVER</span>
            <div class="flex gap-1.5">
                <span id="ledTx" class="w-2.5 h-2.5 rounded-full bg-gray-600 shadow" title="TX"></span>
                <span id="ledRx" class="w-2.5 h-2.5 rounded-full bg-gray-600 shadow" title="RX"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-green-500 shadow animate-pulse" title="PWR"></span>
            </div>
        </div>

        <!-- Kanal Değiştirme Paneli -->
        <div class="bg-gray-950/80 p-3 rounded-xl border border-gray-700 flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <label class="text-xs font-bold text-amber-400">Kanal / Oda:</label>
                <span id="statusText" class="text-[10px] text-yellow-400 truncate max-w-[130px]">Mikrofon bekleniyor...</span>
            </div>
            <div class="flex gap-2">
                <input type="text" id="roomInput" value="telsiz-1" class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-white text-xs focus:outline-none focus:border-amber-500 font-bold">
                <button id="changeChannelBtn" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded text-xs transition cursor-pointer">Değiştir</button>
            </div>
        </div>

        <!-- LCD Ekran -->
        <div class="bg-black border-2 border-gray-600 rounded-lg p-3 text-green-400 font-mono shadow-inner flex flex-col items-center justify-center h-24 relative">
            <div class="text-[10px] text-green-600 absolute top-1 left-2">CH: <span id="currentRoomDisplay" class="text-green-400 font-bold">telsiz-1</span></div>
            <div class="text-center mt-2">
                <div id="lcdStatus" class="text-base font-black tracking-wider">BEKLEMEDE</div>
                <div id="connectionCount" class="text-[10px] text-green-600 mt-1">DURUM: BAĞLANMADI</div>
            </div>
        </div>

        <!-- Hoparlör Izgarası -->
        <div class="flex flex-col gap-1.5 px-6 my-1">
            <div class="h-1 bg-gray-900 rounded-full border-b border-gray-700"></div>
            <div class="h-1 bg-gray-900 rounded-full border-b border-gray-700"></div>
            <div class="h-1 bg-gray-900 rounded-full border-b border-gray-700"></div>
        </div>

        <!-- PTT (Bas-Konuş) Tuşu -->
        <div class="flex flex-col items-center justify-center mb-1">
            <button id="pttBtn" class="w-28 h-28 rounded-full bg-gradient-to-b from-red-600 to-red-900 hover:from-red-500 hover:to-red-800 active:scale-95 shadow-xl border-4 border-red-950 flex flex-col items-center justify-center text-white transition cursor-pointer select-none">
                <span class="text-lg font-black tracking-widest">PTT</span>
                <span class="text-[9px] text-red-200">BAS - KONUŞ</span>
            </button>
        </div>

    </div>

    <!-- Karşı Taraf Sesi İçin Audio Elementi -->
    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        let localStream = null;
        let peer = null;
        let currentCall = null;
        let audioCtx = null;
        let isTransmitting = false;
        let roomName = "telsiz-1";
        let isHost = false;

        const statusText = document.getElementById('statusText');
        const roomInput = document.getElementById('roomInput');
        const changeChannelBtn = document.getElementById('changeChannelBtn');
        const currentRoomDisplay = document.getElementById('currentRoomDisplay');
        const ledTx = document.getElementById('ledTx');
        const ledRx = document.getElementById('ledRx');
        const lcdStatus = document.getElementById('lcdStatus');
        const connectionCount = document.getElementById('connectionCount');
        const pttBtn = document.getElementById('pttBtn');
        const remoteAudio = document.getElementById('remoteAudio');

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playRogerBeep() {
            try {
                initAudioContext();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e){}
        }

        // Mikrofon İzni Al ve Başlangıçta Sesi Kapat (PTT Mantığı İçin)
        navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false })
            .then(stream => {
                localStream = stream;
                // Başlangıçta mikrofondan ses gitmesini engelle (sessiz mod)
                localStream.getAudioTracks()[0].enabled = false;
                
                statusText.innerText = "Mikrofon Hazır";
                statusText.className = "text-[10px] text-green-400 truncate max-w-[130px]";
                connectToRoom(roomInput.value);
            })
            .catch(err => {
                statusText.innerText = "Mikrofon Reddedildi!";
                statusText.className = "text-[10px] text-red-500 truncate max-w-[130px]";
                alert("Telsiz çalışması için mikrofon izni şarttır.");
            });

        function connectToRoom(newRoom) {
            if (peer) {
                peer.destroy();
            }
            
            roomName = newRoom.trim().toLowerCase().replace(/[^a-z0-9]/g, '-');
            currentRoomDisplay.innerText = roomName;
            statusText.innerText = "Kanala bağlanılıyor...";

            // Önce odaya HOST (Ana Telsiz) olmayı dene
            const hostId = 'pmr-' + roomName + '-host';

            peer = new Peer(hostId, {
                config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]}
            });

            peer.on('open', (id) => {
                isHost = true;
                statusText.innerText = "Kanal Kuruldu";
                statusText.className = "text-[10px] text-green-400 truncate max-w-[130px]";
                lcdStatus.innerText = "BEKLEMEDE";
                connectionCount.innerText = "DURUM: ANA TELSİZ";
                
                // Host, misafir aramalarını bekler
                peer.on('call', (call) => {
                    call.answer(localStream);
                    setupCallEvents(call);
                });
            });

            // Eğer bu ID (host) zaten alınmışsa, demek ki odada başka biri var -> GUEST (Misafir) ol
            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    isHost = false;
                    initGuestPeer(roomName);
                } else {
                    statusText.innerText = "Bağlantı Hatası!";
                    statusText.className = "text-[10px] text-red-500 truncate max-w-[130px]";
                }
            });
        }

        function initGuestPeer(room) {
            const guestId = 'pmr-' + room + '-guest-' + Math.floor(Math.random() * 89999 + 10000);
            const hostId = 'pmr-' + room + '-host';

            peer = new Peer(guestId, {
                config: {'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }]}
            });

            peer.on('open', (id) => {
                statusText.innerText = "Kanala Katılındı";
                statusText.className = "text-[10px] text-green-400 truncate max-w-[130px]";
                lcdStatus.innerText = "BEKLEMEDE";
                connectionCount.innerText = "DURUM: BAĞLANILIYOR...";

                // Ana telsizi otomatik ara
                setTimeout(() => {
                    let call = peer.call(hostId, localStream);
                    if (call) {
                        setupCallEvents(call);
                    }
                }, 800);
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                setupCallEvents(call);
            });

            peer.on('error', (err) => {
                statusText.innerText = "Misafir Hatası!";
                statusText.className = "text-[10px] text-red-500 truncate max-w-[130px]";
            });
        }

        function setupCallEvents(call) {
            currentCall = call;
            ledRx.className = "w-2.5 h-2.5 rounded-full bg-green-500 shadow animate-pulse";
            lcdStatus.innerText = "ALINIYOR";
            connectionCount.innerText = "DURUM: BAĞLANDI";

            call.on('stream', (remoteStream) => {
                remoteAudio.srcObject = remoteStream;
                remoteAudio.play().catch(e => console.log(e));
            });

            call.on('close', () => {
                resetRxState();
            });
        }

        function resetRxState() {
            ledRx.className = "w-2.5 h-2.5 rounded-full bg-gray-600 shadow";
            lcdStatus.innerText = "BEKLEMEDE";
            connectionCount.innerText = "DURUM: BAĞLI";
            remoteAudio.srcObject = null;
        }

        changeChannelBtn.addEventListener('click', () => {
            let val = roomInput.value;
            if(val) {
                connectToRoom(val);
            }
        });

        // PTT (Bas-Konuş) Tuşu İşlemleri
        function startTransmission() {
            if (!localStream) return;
            initAudioContext();
            if (isTransmitting) return;

            isTransmitting = true;
            // PTT basıldığında mikrofon sesini aç
            localStream.getAudioTracks()[0].enabled = true;

            ledTx.className = "w-2.5 h-2.5 rounded-full bg-red-500 shadow animate-pulse";
            lcdStatus.innerText = "YAYINDA";

            // Eğer misafirseniz ve henüz çağrı kurulmadıysa tekrar ana telsizi aramayı dene
            if (!isHost && (!currentCall || currentCall.open === false)) {
                let call = peer.call('pmr-' + roomName + '-host', localStream);
                if (call) setupCallEvents(call);
            }
        }

        function stopTransmission() {
            if (!isTransmitting) return;
            isTransmitting = false;
            // PTT bırakıldığında mikrofon sesini kapat
            localStream.getAudioTracks()[0].enabled = false;

            ledTx.className = "w-2.5 h-2.5 rounded-full bg-gray-600 shadow";
            lcdStatus.innerText = "BEKLEMEDE";
            playRogerBeep();
        }

        // Dokunmatik ve Fare Kontrolleri
        pttBtn.addEventListener('mousedown', startTransmission);
        window.addEventListener('mouseup', stopTransmission);

        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTransmission(); });
        window.addEventListener('touchend', (e) => { e.preventDefault(); stopTransmission(); });
    </script>
</body>
</html>
