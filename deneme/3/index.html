<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masaüstü Video Kaynak Yakalayıcı</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            padding: 15px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        header p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .browser-container {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 380px;
        }

        webview {
            width: 100%;
            height: 100%;
            background: white;
        }

        .results-section {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .results-header h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .badge {
            background: var(--bg-color);
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .video-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-item {
            background: var(--bg-color);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-url {
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
        }

        .video-actions {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.75rem;
        }

        .btn-success {
            background-color: var(--success-color);
        }
        .btn-success:hover {
            background-color: #16a34a;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Masaüstü Video Kaynak Yakalayıcı</h1>
            <p>Web sitelerindeki m3u8, mp4 ve akış bağlantılarını otomatik tespit edin.</p>
        </header>

        <div class="control-panel">
            <input type="text" id="urlInput" placeholder="https://ornek-site.com (Video olan sayfa)" value="https://www.w3schools.com/html/html5_video.asp">
            <button id="goBtn">Sayfayı Aç</button>
        </div>

        <div class="browser-container">
            <webview id="view" src="https://www.w3schools.com/html/html5_video.asp"></webview>
        </div>

        <div class="results-section">
            <div class="results-header">
                <h3>Yakalanan Kaynaklar</h3>
                <span class="badge" id="countBadge">0 Kaynak</span>
            </div>
            <ul class="video-list" id="videoList">
                <div class="empty-state" id="emptyState">Henüz video kaynağı yakalanmadı. Yukarıdan bir site açın ve videoyu oynatın.</div>
            </ul>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const view = document.getElementById('view');
        const urlInput = document.getElementById('urlInput');
        const goBtn = document.getElementById('goBtn');
        const videoList = document.getElementById('videoList');
        const emptyState = document.getElementById('emptyState');
        const countBadge = document.getElementById('countBadge');

        let capturedVideos = new Set();

        goBtn.addEventListener('click', () => {
            let url = urlInput.value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                urlInput.value = url;
            }
            view.src = url;
        });

        // Main process'ten gelen video yakalama sinyalini dinle
        ipcRenderer.on('video-captured', (event, url) => {
            if (capturedVideos.has(url)) return;
            capturedVideos.add(url);

            if (emptyState) {
                emptyState.remove();
            }

            countBadge.textContent = `${capturedVideos.size} Kaynak`;

            const li = document.createElement('li');
            li.className = 'video-item';
            li.innerHTML = `
                <div class="video-url">${url}</div>
                <div class="video-actions">
                    <a href="${url}" target="_blank" style="text-decoration:none;"><button class="button btn-sm">Yeni Sekmede Aç</button></a>
                    <button class="button btn-sm btn-success" onclick="navigator.clipboard.writeText('${url}'); alert('Bağlantı kopyalandı!');">Kopyala</button>
                </div>
            `;
            videoList.appendChild(li);
        });
    </script>
</body>
</html>
