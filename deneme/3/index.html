<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexTalk Enterprise - High Contrast Cloud VoIP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        
        body.theme-indigo { --accent: 99, 102, 241; --accent-hex: #6366f1; }
        body.theme-emerald { --accent: 16, 185, 129; --accent-hex: #10b981; }
        body.theme-amber { --accent: 245, 158, 11; --accent-hex: #f59e0b; }
        body.theme-rose { --accent: 244, 63, 94; --accent-hex: #f43f5e; }

        .dark body { background-color: #0f172a; }
        body { background-color: #f8fafc; }

        /* Yüksek Kontrastlı Panel ve Tuş Tasarımları */
        .dark .glass-panel { 
            background: #1e293b; 
            border: 1px solid #334155; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glass-panel { 
            background: #ffffff; 
            border: 1px solid #cbd5e1; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .dark .glass-btn { 
            background: #334155; 
            border: 1px solid #475569; 
            color: #ffffff; 
        }
        .dark .glass-btn:hover { 
            background: #475569; 
            border-color: #64748b; 
            transform: translateY(-2px);
        }

        .glass-btn { 
            background: #e2e8f0; 
            border: 1px solid #cbd5e1; 
            color: #0f172a; 
            transition: all 0.2s ease; 
        }
        .glass-btn:hover { 
            background: #cbd5e1; 
            transform: translateY(-2px); 
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.4); border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 theme-indigo">

    <!-- İLK GİRİŞ EKRANI -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl hidden items-center justify-center p-4 z-50">
        <div class="glass-panel w-full max-w-sm p-6 rounded-3xl space-y-4">
            <div class="text-center">
                <div class="w-12 h-12 rounded-2xl bg-[rgb(var(--accent))]/20 text-[rgb(var(--accent))] flex items-center justify-center mx-auto mb-2 border border-[rgb(var(--accent))]/40">
                    <i data-lucide="phone-call" class="w-6 h-6"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900 dark:text-white">NexTalk Enterprise</h2>
                <p class="text-xs text-slate-500 dark:text-slate-300 font-medium">Kayıt bilgileri yerel hafızaya saklanacaktır.</p>
            </div>
            <div class="space-y-3">
                <input type="text" id="auth-phone" placeholder="Telefon Numarası (Örn: 5551234567)" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-3 text-sm font-mono font-semibold text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[rgb(var(--accent))]">
                <input type="text" id="auth-name" placeholder="Adınız Soyadınız" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-3 text-sm font-semibold text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-[rgb(var(--accent))]">
            </div>
            <div class="pt-2">
                <button onclick="registerAccount()" class="w-full bg-[rgb(var(--accent))] text-white py-3 rounded-xl text-sm font-bold shadow-lg flex items-center justify-center gap-2 hover:opacity-90">
                    <i data-lucide="check-circle" class="w-4 h-4"></i> Kaydı Tamamla & Başla
                </button>
            </div>
        </div>
    </div>

    <!-- ANA UYGULAMA KONTEYNERİ -->
    <div class="glass-panel w-full max-w-md rounded-3xl overflow-hidden flex flex-col h-[850px] relative">
        
        <!-- ÜST BAR -->
        <header class="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-100 dark:bg-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[rgb(var(--accent))]/20 border border-[rgb(var(--accent))]/40 flex items-center justify-center text-[rgb(var(--accent))]">
                    <i data-lucide="phone-call" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wide text-slate-900 dark:text-white" id="user-display-name">NexTalk</h1>
                    <div class="flex items-center gap-2">
                        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                        <span id="status-text" class="text-xs text-slate-600 dark:text-slate-300 font-semibold">Bağlanıyor...</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="switchTab('settings')" class="p-2.5 rounded-xl glass-btn text-slate-700 dark:text-slate-200"><i data-lucide="settings" class="w-5 h-5"></i></button>
            </div>
        </header>

        <!-- İÇERİK SEKMELERİ -->
        <main class="flex-1 overflow-y-auto relative p-5">
            
            <!-- 1. TUŞ TAKIMI / ARAMA -->
            <div id="tab-dialer" class="tab-content flex flex-col h-full justify-between">
                <div class="flex flex-col items-center justify-center my-2">
                    <input type="text" id="phone-display" placeholder="Numara Ara..." 
                        class="bg-transparent text-center text-3xl font-mono font-extrabold tracking-wider text-[rgb(var(--accent))] placeholder:text-slate-400 focus:outline-none w-full">
                    <span class="text-xs text-slate-500 dark:text-slate-400 font-medium mt-1">Aramak için numara tuşlayın</span>
                </div>

                <!-- Yüksek Kontrastlı Canlı Tuşlar -->
                <div class="grid grid-cols-3 gap-3 my-auto">
                    <button onclick="appendNum('1')" class="glass-btn h-14 rounded-2xl flex items-center justify-center text-2xl font-bold shadow-sm">1</button>
                    <button onclick="appendNum('2')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm"><span class="text-xl font-bold leading-none">2</span><span class="text-[10px] font-bold text-slate-400 dark:text-slate-300 mt-1">ABC</span></button>
                    <button onclick="appendNum('3')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm"><span class="text-xl font-bold leading-none">3</span><span class="text-[10px] font-bold text-slate-400 dark:text-slate-300 mt-1">DEF</span></button>
                    <button onclick="appendNum('4')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm"><span class="text-xl font-bold leading-none">4</span><span class="text-[10px] font-bold text-slate-400 dark:text-slate-300 mt-1">GHI</span></button>
                    <button onclick="appendNum('5')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm"><span class="text-xl font-bold leading-none">5</span><span class="text-[10px] font-bold text-slate-400 dark:text-slate-300 mt-1">JKL</span></button>
                    <button onclick="appendNum('6')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm"><span class="text-xl font-bold leading-none">6</span><span class="text-[10px] font-bold text-slate-400 dark:text-slate-300 mt-1">MNO</span></button>
                    <button onclick="appendNum('7')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm"><span class="text-xl font-bold leading-none">7</span><span class="text-[10px] font-bold text-slate-400 dark:text-slate-300 mt-1">PQRS</span></button>
                    <button onclick="appendNum('8')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm"><span class="text-xl font-bold leading-none">8</span><span class="text-[8px] font-bold text-slate-400 dark:text-slate-300 mt-1">TUV</span></button>
                    <button onclick="appendNum('9')" class="glass-btn h-14 rounded-2xl flex flex-col items-center justify-center shadow-sm"><span class="text-xl font-bold leading-none">9</span><span class="text-[10px] font-bold text-slate-400 dark:text-slate-300 mt-1">WXYZ</span></button>
                    <button onclick="appendNum('*')" class="glass-btn h-14 rounded-2xl flex items-center justify-center text-2xl font-bold shadow-sm text-slate-400 dark:text-slate-300">*</button>
                    <button onclick="appendNum('0')" class="glass-btn h-14 rounded-2xl flex items-center justify-center text-2xl font-bold shadow-sm">0</button>
                    <button onclick="deleteNum()" class="glass-btn h-14 rounded-2xl flex items-center justify-center text-xl font-bold shadow-sm text-rose-500">⌫</button>
                </div>

                <div class="flex items-center justify-center gap-4 mt-2">
                    <button onclick="makeCall()" class="w-16 h-16 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-xl hover:bg-emerald-600 transition-all">
                        <i data-lucide="phone" class="w-8 h-8"></i>
                    </button>
                </div>
            </div>

            <!-- 2. REHBER VE ÇEVRİMİÇİ KULLANICILAR -->
            <div id="tab-contacts" class="tab-content hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Özel Rehberim</h3>
                    <button onclick="openAddContactModal()" class="text-xs bg-[rgb(var(--accent))]/10 text-[rgb(var(--accent))] border border-[rgb(var(--accent))]/40 px-3 py-1.5 rounded-xl font-bold flex items-center gap-1">
                        <i data-lucide="user-plus" class="w-4 h-4"></i> Kişi Ekle
                    </button>
                </div>
                <div id="my-contacts-list" class="space-y-2"></div>

                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 pt-4">Ağdaki Çevrimiçi Kullanıcılar</h3>
                <div id="online-users-list" class="space-y-2"></div>
            </div>

            <!-- 3. GEÇMİŞ -->
            <div id="tab-history" class="tab-content hidden space-y-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Arama Geçmişi</h3>
                <div id="history-list" class="space-y-2"></div>
            </div>

            <!-- 4. AYARLAR -->
            <div id="tab-settings" class="tab-content hidden space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Gelişmiş Ayarlar</h3>
                
                <div class="glass-panel p-4 rounded-2xl space-y-2">
                    <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Tema Rengi</span>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setThemeColor('indigo')" class="h-9 rounded-xl bg-indigo-500 text-white text-xs font-bold">İndigo</button>
                        <button onclick="setThemeColor('emerald')" class="h-9 rounded-xl bg-emerald-500 text-white text-xs font-bold">Yeşil</button>
                        <button onclick="setThemeColor('amber')" class="h-9 rounded-xl bg-amber-500 text-white text-xs font-bold">Turuncu</button>
                        <button onclick="setThemeColor('rose')" class="h-9 rounded-xl bg-rose-500 text-white text-xs font-bold">Gül</button>
                    </div>
                </div>

                <div class="glass-panel p-4 rounded-2xl space-y-2">
                    <span class="text-xs font-bold text-slate-800 dark:text-slate-200">Oturum Bilgileri</span>
                    <button onclick="logoutAccount()" class="w-full py-2.5 bg-rose-500/20 text-rose-500 dark:text-rose-400 text-xs font-bold rounded-xl border border-rose-500/30">Hesaptan Çıkış Yap / Bilgileri Sıfırla</button>
                </div>
            </div>
        </main>

        <!-- KİŞİ EKLEME MODALI -->
        <div id="contact-modal" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md hidden items-center justify-center p-6 z-50">
            <div class="glass-panel w-full p-6 rounded-3xl space-y-4">
                <h3 class="font-bold text-slate-900 dark:text-white text-base">Rehbere Kişi Ekle</h3>
                <input type="text" id="contact-name-input" placeholder="Kişinin Adı Soyadı" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none">
                <input type="text" id="contact-phone-input" placeholder="Telefon Numarası" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm font-mono text-slate-900 dark:text-white focus:outline-none">
                <div class="flex gap-3 pt-2">
                    <button onclick="closeAddContactModal()" class="flex-1 glass-btn py-2.5 rounded-xl text-sm font-bold">İptal</button>
                    <button onclick="saveContactToCloud()" class="flex-1 bg-[rgb(var(--accent))] text-white py-2.5 rounded-xl text-sm font-bold">Kaydet</button>
                </div>
            </div>
        </div>

        <!-- AKTİF ARAMA OVERLAY -->
        <div id="call-overlay" class="absolute inset-0 bg-slate-950 flex flex-col justify-between p-6 z-50 transform translate-y-full transition-transform duration-300">
            <div class="text-center pt-8">
                <span id="call-status-label" class="text-xs font-bold uppercase tracking-widest text-[rgb(var(--accent))] mb-2 block">Aranıyor...</span>
                <div class="w-24 h-24 rounded-full bg-[rgb(var(--accent))]/20 border-2 border-[rgb(var(--accent))]/50 flex items-center justify-center mx-auto mb-2" id="call-avatar-wrap">
                    <i data-lucide="user" class="w-10 h-10 text-[rgb(var(--accent))]"></i>
                </div>
                <h2 id="call-remote-id" class="text-xl font-bold text-white tracking-wide">Numara: ----</h2>
                <p id="call-timer" class="text-slate-400 text-xs mt-1 font-mono">00:00</p>
            </div>

            <div class="space-y-4 pb-4">
                <div class="flex justify-center gap-3 flex-wrap">
                    <button id="btn-hold" onclick="toggleHold()" title="Beklet" class="w-12 h-12 rounded-2xl glass-btn text-white flex items-center justify-center"><i data-lucide="pause" class="w-5 h-5"></i></button>
                    <button onclick="promptTransfer()" title="3 Yönlü Konferans" class="w-12 h-12 rounded-2xl glass-btn text-white flex items-center justify-center"><i data-lucide="users" class="w-5 h-5"></i></button>
                    <button onclick="recordVoicemail()" title="Sesli Mesaj" class="w-12 h-12 rounded-2xl glass-btn text-white flex items-center justify-center"><i data-lucide="mic" class="w-5 h-5"></i></button>
                </div>

                <div class="flex justify-center items-center gap-6">
                    <button id="btn-accept" onclick="acceptCall()" class="hidden w-14 h-14 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-lg"><i data-lucide="phone" class="w-6 h-6"></i></button>
                    <button onclick="endCall()" class="w-14 h-14 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-lg"><i data-lucide="phone-off" class="w-6 h-6"></i></button>
                </div>
            </div>
        </div>

        <!-- ALT MENÜ -->
        <nav class="border-t border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-800 p-3 grid grid-cols-3 gap-2">
            <button onclick="switchTab('dialer')" id="nav-dialer" class="flex flex-col items-center py-2 rounded-xl text-[rgb(var(--accent))] bg-[rgb(var(--accent))]/10 font-bold"><i data-lucide="grid" class="w-5 h-5 mb-1"></i><span class="text-[10px]">Tuşlar</span></button>
            <button onclick="switchTab('contacts')" id="nav-contacts" class="flex flex-col items-center py-2 rounded-xl text-slate-600 dark:text-slate-300 font-bold"><i data-lucide="users" class="w-5 h-5 mb-1"></i><span class="text-[10px]">Rehber</span></button>
            <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center py-2 rounded-xl text-slate-600 dark:text-slate-300 font-bold"><i data-lucide="clock" class="w-5 h-5 mb-1"></i><span class="text-[10px]">Geçmiş</span></button>
        </nav>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        const FirebaseConfig = {
            config: {
                apiKey: "AIzaSyBSnLEGFgEas1fc-5oHQ8K_tM_Hlz_Maw8",
                authDomain: "deneme-47c9a.firebaseapp.com",
                databaseURL: "https://deneme-47c9a-default-rtdb.firebaseio.com",
                projectId: "deneme-47c9a",
                storageBucket: "deneme-47c9a.firebasestorage.app",
                messagingSenderId: "559947698789",
                appId: "1:559947698789:web:5f64226d43d0b4233e6c8c",
                measurementId: "G-3CT3SC5BR6"
            },
            rootPath: "phones"
        };

        firebase.initializeApp(FirebaseConfig.config);
        const db = firebase.database();

        lucide.createIcons();

        let currentPhone = localStorage.getItem('nextalk_phone');
        let currentName = localStorage.getItem('nextalk_name');
        let peer = null, currentCall = null, localStream = null;
        let isHold = false;
        let callHistory = JSON.parse(localStorage.getItem('nextalk_history') || '[]');

        window.addEventListener('DOMContentLoaded', () => {
            if(!currentPhone || !currentName) {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('auth-screen').classList.add('flex');
            } else {
                initApp();
            }
        });

        function registerAccount() {
            const phone = document.getElementById('auth-phone').value.trim();
            const name = document.getElementById('auth-name').value.trim();
            if(!phone || !name) return alert("Lütfen telefon numarası ve adınızı soyadınızı girin!");

            currentPhone = phone;
            currentName = name;

            localStorage.setItem('nextalk_phone', phone);
            localStorage.setItem('nextalk_name', name);

            db.ref(FirebaseConfig.rootPath + '/' + phone).update({ 
                name: name, 
                status: 'online' 
            });

            document.getElementById('auth-screen').classList.remove('flex');
            document.getElementById('auth-screen').classList.add('hidden');
            initApp();
        }

        function logoutAccount() {
            if(confirm("Hesaptan çıkış yapmak istiyor musunuz?")) {
                db.ref(FirebaseConfig.rootPath + '/' + currentPhone).update({ status: 'offline' });
                localStorage.removeItem('nextalk_phone');
                localStorage.removeItem('nextalk_name');
                location.reload();
            }
        }

        function initApp() {
            document.getElementById('user-display-name').innerText = currentName + " (" + currentPhone + ")";

            db.ref(FirebaseConfig.rootPath + '/' + currentPhone).update({ status: 'online' });
            db.ref(FirebaseConfig.rootPath + '/' + currentPhone).onDisconnect().update({ status: 'offline' });

            peer = new Peer('nextalk-' + currentPhone, { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
            
            peer.on('open', () => {
                document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                document.getElementById('status-text').innerText = "Çevrimiçi";
            });

            peer.on('call', (incomingCall) => {
                currentCall = incomingCall;
                if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
                showIncomingCallOverlay(incomingCall.peer.replace('nextalk-', ''));
            });

            loadMyContacts();
            loadOnlineUsers();
        }

        function openAddContactModal() {
            document.getElementById('contact-modal').classList.remove('hidden');
            document.getElementById('contact-modal').classList.add('flex');
        }
        function closeAddContactModal() {
            document.getElementById('contact-modal').classList.remove('flex');
            document.getElementById('contact-modal').classList.add('hidden');
        }

        function saveContactToCloud() {
            const name = document.getElementById('contact-name-input').value.trim();
            const phone = document.getElementById('contact-phone-input').value.trim();
            if(!name || !phone) return alert("Alanları doldurun!");

            db.ref(FirebaseConfig.rootPath + '/' + currentPhone + '/contacts/' + phone).set({
                name: name,
                phone: phone
            });

            document.getElementById('contact-name-input').value = "";
            document.getElementById('contact-phone-input').value = "";
            closeAddContactModal();
        }

        function loadMyContacts() {
            db.ref(FirebaseConfig.rootPath + '/' + currentPhone + '/contacts').on('value', snapshot => {
                const contacts = snapshot.val();
                const container = document.getElementById('my-contacts-list');
                container.innerHTML = "";
                if(!contacts) {
                    container.innerHTML = `<p class="text-xs text-slate-400 font-medium">Rehberiniz boş.</p>`;
                    return;
                }
                for(let phone in contacts) {
                    let c = contacts[phone];
                    container.innerHTML += `
                        <div class="glass-btn p-3 rounded-2xl flex justify-between items-center">
                            <div>
                                <h4 class="text-sm font-bold text-slate-900 dark:text-white">${c.name}</h4>
                                <p class="text-xs text-slate-500 dark:text-slate-300 font-mono font-semibold">${c.phone}</p>
                            </div>
                            <button onclick="quickCall('${c.phone}')" class="p-2 bg-emerald-500/10 text-emerald-500 rounded-xl"><i data-lucide="phone" class="w-4 h-4"></i></button>
                        </div>
                    `;
                }
                lucide.createIcons();
            });
        }

        function loadOnlineUsers() {
            db.ref(FirebaseConfig.rootPath).on('value', snapshot => {
                const users = snapshot.val();
                const container = document.getElementById('online-users-list');
                container.innerHTML = "";
                for(let phone in users) {
                    if(phone === currentPhone) continue;
                    let u = users[phone];
                    container.innerHTML += `
                        <div class="glass-btn p-3 rounded-2xl flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full ${u.status === 'online' ? 'bg-emerald-500' : 'bg-slate-500'}"></span>
                                <div>
                                    <h4 class="text-sm font-bold text-slate-900 dark:text-white">${u.name}</h4>
                                    <p class="text-xs text-slate-500 dark:text-slate-300 font-mono font-semibold">${phone}</p>
                                </div>
                            </div>
                            <button onclick="quickCall('${phone}')" class="p-2 bg-emerald-500/10 text-emerald-500 rounded-xl"><i data-lucide="phone" class="w-4 h-4"></i></button>
                        </div>
                    `;
                }
                lucide.createIcons();
            });
        }

        async function makeCall() {
            let targetPhone = document.getElementById('phone-display').value.trim();
            if(!targetPhone) return alert("Numara girin!");

            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            showCallOverlay(targetPhone, "Aranıyor...");
            document.getElementById('btn-accept').classList.add('hidden');

            currentCall = peer.call('nextalk-' + targetPhone, localStream);
            handleCallEvents(currentCall);
            addHistory(targetPhone, 'outgoing');
        }

        function showIncomingCallOverlay(remotePhone) {
            showCallOverlay(remotePhone, "Gelen Arama...");
            document.getElementById('btn-accept').classList.remove('hidden');
        }

        async function acceptCall() {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            document.getElementById('btn-accept').classList.add('hidden');
            document.getElementById('call-status-label').innerText = "Bağlandı";
            currentCall.answer(localStream);
            handleCallEvents(currentCall);
        }

        function handleCallEvents(call) {
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-audio').srcObject = remoteStream;
                document.getElementById('call-status-label').innerText = "Bağlandı";
            });
            call.on('close', () => resetCallUI());
        }

        function endCall() {
            if(currentCall) currentCall.close();
            resetCallUI();
        }

        function showCallOverlay(phone, status) {
            document.getElementById('call-remote-id').innerText = "Tel: " + phone;
            document.getElementById('call-status-label').innerText = status;
            document.getElementById('call-overlay').classList.remove('translate-y-full');
        }

        function resetCallUI() {
            document.getElementById('call-overlay').classList.add('translate-y-full');
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            currentCall = null;
        }

        function toggleHold() {
            isHold = !isHold;
            const btn = document.getElementById('btn-hold');
            btn.classList.toggle('bg-amber-500/20', isHold);
            if(isHold) {
                if(localStream) localStream.getAudioTracks()[0].enabled = false;
                alert("Arama bekletmeye alındı.");
            } else {
                if(localStream) localStream.getAudioTracks()[0].enabled = true;
            }
        }

        function promptTransfer() { alert("Aktarım için numara tuşlayın."); }
        function recordVoicemail() { alert("Sesli mesaj kaydı başlatıldı."); }

        function appendNum(char) { document.getElementById('phone-display').value += char; }
        function deleteNum() { let d = document.getElementById('phone-display'); d.value = d.value.slice(0, -1); }
        function quickCall(phone) { document.getElementById('phone-display').value = phone; switchTab('dialer'); makeCall(); }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
        }
        function setThemeColor(color) { document.body.className = document.body.className.replace(/theme-\w+/, '') + ' theme-' + color; }

        function addHistory(phone, type) {
            callHistory.unshift({ phone, type, time: new Date().toLocaleTimeString() });
            localStorage.setItem('nextalk_history', JSON.stringify(callHistory));
            renderHistory();
        }
        function renderHistory() {
            document.getElementById('history-list').innerHTML = callHistory.map(h => `
                <div class="glass-btn p-3 rounded-2xl flex justify-between items-center text-xs">
                    <div><b class="text-slate-900 dark:text-white">${h.phone}</b> • ${h.type}</div><span>${h.time}</span>
                </div>
            `).join('');
        }
        renderHistory();
    </script>
</body>
</html>
